<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rayon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7A70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rayon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single mobile column (max 640px), sticky top bar, fixed bottom tab bar with a central "+" — the hero is a hang-tag (étiquette) showing net profit. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F5F8F6; --line:#D6DED9; --ink:#14211D; --muted:#5B6A64;
  --accent:#0B7A70; --accent-ink:#FFFFFF; --accent-soft:#D5EEEA;
  --tag:#E8B743; --tag-ink:#2E2200; --tag-line:#C99A2A;
  --good:#1E8549; --good-soft:#DCF1E3; --warn:#A86A12; --warn-soft:#FBEACB;
  --bad:#BF3B35; --bad-soft:#F8DCDA; --info:#2B67A8; --info-soft:#DCE7F4; --violet:#6F52AE; --violet-soft:#EAE3F6;
  --shadow:0 1px 2px rgba(20,33,29,.06),0 6px 20px rgba(20,33,29,.06);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --line:#293732; --ink:#E6EEEA; --muted:#98A9A2;
  --accent:#36C0B1; --accent-ink:#04201C; --accent-soft:#143A35;
  --tag:#EDC25B; --tag-ink:#271C00; --tag-line:#B8902E;
  --good:#4FC482; --good-soft:#15301F; --warn:#E6AA4B; --warn-soft:#3A2B12;
  --bad:#F2716A; --bad-soft:#3C1D1B; --info:#72A9E6; --info-soft:#172739; --violet:#B39BEA; --violet-soft:#29213D;
  --shadow:0 1px 0 rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --line:#293732; --ink:#E6EEEA; --muted:#98A9A2;
  --accent:#36C0B1; --accent-ink:#04201C; --accent-soft:#143A35;
  --tag:#EDC25B; --tag-ink:#271C00; --tag-line:#B8902E;
  --good:#4FC482; --good-soft:#15301F; --warn:#E6AA4B; --warn-soft:#3A2B12;
  --bad:#F2716A; --bad-soft:#3C1D1B; --info:#72A9E6; --info-soft:#172739; --violet:#B39BEA; --violet-soft:#29213D;
  --shadow:0 1px 0 rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.02em}
.muted{color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:5px 5px 5px 11px;background:var(--tag);display:inline-block;position:relative;transform:rotate(-8deg)}
.brand i::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--bg);top:4px;left:4px}
.top .sp{flex:1}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip-btn.live{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.live .dot{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;padding:6px 0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.nav .plus{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto;transform:translateY(-14px);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.nav .plus svg{width:26px;height:26px}

/* sections */
.sec{margin-top:22px;min-width:0}
.card{min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:18px}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.grid2.k4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:21px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* hero tag */
.hero{position:relative;margin-top:8px;background:var(--tag);color:var(--tag-ink);border-radius:18px 18px 18px 46px;padding:20px 20px 18px 56px;overflow:hidden}
.hero::before{content:"";position:absolute;left:20px;top:22px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px var(--tag-line)}
.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:44px;border-right:2px dashed color-mix(in srgb,var(--tag-ink) 22%,transparent)}
.hero .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,58px);line-height:1;margin-top:6px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .sub{margin-top:8px;font-weight:600;font-size:14px}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--tag-ink) 14%,transparent);overflow:hidden;margin-top:14px}
.bar > span{display:block;height:100%;border-radius:99px;background:var(--tag-ink);transition:width .6s ease}
.hero .row{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-top:6px;opacity:.85}
.pbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.pbar > span{display:block;height:100%;background:var(--accent);border-radius:99px}
.pbar.warn > span{background:var(--warn)} .pbar.bad > span{background:var(--bad)} .pbar.good > span{background:var(--good)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;font-size:14px;border:1px solid transparent;cursor:pointer;text-align:left;width:100%}
.alert b{display:block}
.alert.info{background:var(--info-soft);color:var(--ink)} .alert.info .ic{color:var(--info)}
.alert.warn{background:var(--warn-soft)} .alert.warn .ic{color:var(--warn)}
.alert.bad{background:var(--bad-soft)} .alert.bad .ic{color:var(--bad)}
.alert.good{background:var(--good-soft)} .alert.good .ic{color:var(--good)}
.alert .ic{flex:none;width:20px;height:20px;margin-top:1px}
.alert .go{margin-left:auto;flex:none;opacity:.5}

/* charts */
.chart-box{position:relative;height:220px}
.chart-box.sm{height:190px}
.empty-chart{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* list */
.toolbar{display:flex;gap:8px;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:5;background:var(--bg);padding:6px 0}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;contain:inline-size;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;width:100%}
.thumb{width:56px;height:56px;border-radius:10px;flex:none;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--muted);border:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.price{font-family:var(--f-display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st-stock{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.st-ligne{background:var(--info-soft);color:var(--info)}
.st-reserve{background:var(--warn-soft);color:var(--warn)}
.st-vendu{background:var(--good-soft);color:var(--good)}
.st-retour{background:var(--violet-soft);color:var(--violet)}
.st-inv{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.tag{background:var(--tag);color:var(--tag-ink);border-color:var(--tag-line)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns > .btn{flex:1 1 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.45);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:19px;flex:1;min-width:0}
.sheet-b{overflow-y:auto;min-height:0;flex:1 1 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet:has(.sheet-foot:not([hidden])) .sheet-b{padding-bottom:16px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0}

/* forms */
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.fg > label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;outline:0;font-size:16px}
textarea.inp{height:auto;min-height:90px;padding:10px 12px;line-height:1.45}
.inp:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:600;cursor:pointer}
.opt button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hint{font-size:12px;color:var(--muted)}
.suggest{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.suggest b{font-family:var(--f-display);font-size:18px}
.photo{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:14px;border:1px dashed var(--line);background:var(--surface);display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;color:var(--muted);font-weight:600}
.photo img{width:100%;height:100%;object-fit:cover}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.mini .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.mini .v{font-family:var(--f-display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}

/* annonce */
.out{contain:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.5;word-break:break-word}
.out-h{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.tip{font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tip li{margin:3px 0}

/* table */
.tbl-w{overflow-x:auto;contain:inline-size;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right}

/* todo strip */
.todo-wrap{margin-top:12px;contain:inline-size;max-width:100%}
.todo{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.todo::-webkit-scrollbar{display:none}
.todo-chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px 8px 10px;cursor:pointer;text-align:left;scroll-snap-align:start;max-width:240px}
.todo-chip .ti{font-size:18px;line-height:1}
.todo-chip .tt{display:flex;flex-direction:column;min-width:0}
.todo-chip b{font-size:13px;white-space:nowrap}
.todo-chip small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-chip.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.todo-chip.bad{border-color:var(--bad);background:var(--bad-soft)}
.todo-chip.good{background:var(--good-soft);border-color:transparent}
.todo-chip.info{background:var(--info-soft);border-color:transparent}
/* collapsible sections */
.sec-tog{width:100%;background:none;border:0;padding:0;cursor:pointer;text-align:left;align-items:center}
.sec-tog .chev{margin-left:auto;display:inline-flex;transition:transform .2s;color:var(--muted)}
.sec-tog .chev svg{width:16px;height:16px;transform:rotate(90deg)}
.coll.open .sec-tog .chev svg{transform:rotate(-90deg)}
.coll:not(.open) .sec-body{display:none}
.coll:not(.open) .sec-h{margin-bottom:0}
.coll.card:not(.open){padding:12px 14px}
.coll .sec-h{display:flex;gap:10px}
.coll .sec-h .eyebrow{margin-left:auto;text-align:right}
.coll .sec-h .chev{margin-left:0}
/* swipe rows */
.sw{position:relative;overflow:hidden;border-radius:14px;--p:0}
.sw-body{position:relative;z-index:1;touch-action:pan-y;will-change:transform;background:var(--bg);-webkit-user-select:none;user-select:none}
.sw.drag .sw-body *{pointer-events:none}
.sw-body .item{width:100%}
.sw-acts{position:absolute;top:0;bottom:0;display:flex;z-index:0;visibility:hidden}
.sw-acts.l{right:0} .sw-acts.r{left:0;flex-direction:row-reverse}
.sw.left .sw-acts.l,.sw.right .sw-acts.r{visibility:visible}
.sw-act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:78px;border:0;cursor:pointer;color:#fff;font-weight:700;flex:none;transition:flex .18s ease,width .18s ease;-webkit-tap-highlight-color:transparent}
.sw-act i{font-style:normal;font-size:20px;line-height:1;display:inline-flex;transform:scale(calc(.6 + var(--p)*.4));opacity:calc(.4 + var(--p)*.6);transition:transform .12s}
.sw-act i svg{width:20px;height:20px}
.sw-act small{font-size:11px;opacity:var(--p)}
.sw-act.good{background:var(--good)} .sw-act.info{background:var(--info)} .sw-act.bad{background:var(--bad)} .sw-act.tag{background:var(--tag);color:var(--tag-ink)} .sw-act.neutral{background:var(--muted)} .sw-act.warn{background:var(--warn)} .sw-act.violet{background:var(--violet)}
.sw.full .sw-acts.l,.sw.full-r .sw-acts.r{width:100%}
.sw.full .sw-acts.l .sw-act:first-child,.sw.full-r .sw-acts.r .sw-act:first-child{flex:1}
.sw.full .sw-acts.l .sw-act:not(:first-child){width:0;overflow:hidden;padding:0}
.sw.full .sw-act:first-child i,.sw.full-r .sw-act:first-child i{transform:scale(1.3)}
.sw.open .sw-act i{transform:scale(1);opacity:1} .sw.open .sw-act small{opacity:1}
.kpi.link{cursor:pointer;text-align:left;position:relative;font:inherit;color:inherit}
.kpi.link .l{padding-right:16px}
.kpi.link:active{background:var(--surface-2)}
.kpi-go{position:absolute;right:8px;top:10px;color:var(--muted);opacity:.6}
.kpi-go svg{width:14px;height:14px}
tr.rowlink{cursor:pointer} tr.rowlink:active td{background:var(--surface-2)}

function brandOf(name){ if(!name) return null; return BRANDS[norm(name)]||null }
function brandName(name){ const b=brandOf(name); return b?b.name:(name||"").trim() }

/* ---------- Moteur de prix ----------
   Prix de référence (tier 3, très bon état, taille M/L, pleine saison), en euros, pour Vinted homme. */
const REF={"Sweat":18,"Hoodie":20,"Pull":18,"Gilet / Zip":18,"T-shirt":9,"Polo":13,"Chemise":13,"Veste":28,"Doudoune":40,"Manteau":38,"Blazer":22,"Pantalon":14,"Jean":16,"Short":10,"Accessoire":9,"Autre":12};
const COND={"Neuf avec étiquette":1.45,"Neuf sans étiquette":1.25,"Très bon état":1,"Bon état":.78,"Satisfaisant":.55};
const SIZE_M={XS:.9,S:.98,M:1.05,L:1.05,XL:1,XXL:.92,XXXL:.85};
const MAT_M={"Cachemire":1.45,"Laine mérinos":1.2,"Laine":1.1,"Cuir":1.45,"Coton bio":1.03,"Lin":1.05,"Denim":1,"Velours côtelé":1.05,"Polaire":1,"Nylon":1,"Polyester":.95,"Coton / polyester":.97,"Coton":1,"Autre":1};
const DET_M={"Vintage":1.1,"Grand logo":1.08,"Made in Europe":1.08,"Épais et chaud":1.04,"Col camionneur":1.05,"Oversize":1.03,"Capuche":1.02,"Zippé":1.02,"Logo brodé":1,"Col rond":1,"Col V":.98,"Coupe ajustée":1};
function seasonFactor(type){ const t=TYPES[type]; if(!t) return 1; const m=new Date().getMonth()+1; const cold=m>=10||m<=2, shoulder=m===3||m===9, hot=m>=5&&m<=7;
  if(t.warm) return cold?1.1:shoulder?1.03:hot?.85:.95; return hot?1.08:cold?.9:1 }
function nice(v){ v=Math.max(2,v); if(v<15) return Math.round(v); if(v<40) return Math.round(v); return Math.round(v/5)*5 }
function estimate(a){
  const type=TYPES[a.type]?a.type:"Autre", br=brandOf(a.marque), custom=!!(a.marque&&!br);
  const F=[]; // facteurs expliqués
  let p=REF[type];
  F.push({k:"Catégorie",v:a.type||"non renseignée",m:null,base:p});
  const tm=br?TIER_MULT[br.tier]*br.adj:custom?TIER_MULT[2]*.8:TIER_MULT[2]*.6;
  p*=tm; F.push({k:br?`${br.name} · ${TIER_LABEL[br.tier]}`:custom?`${a.marque} · marque hors catalogue`:"Marque non renseignée",m:tm});
  if(br&&br.hot[type]){p*=br.hot[type];F.push({k:`${br.name} très recherché en ${type.toLowerCase()}`,m:br.hot[type]})}
  const c=COND[a.etat]||1; if(a.etat){p*=c;F.push({k:"État : "+a.etat.toLowerCase(),m:c})}
  const sz=SIZE_M[a.taille]; if(sz&&sz!==1){p*=sz;F.push({k:"Taille "+a.taille+(sz>1?" (très demandée)":" (moins demandée)"),m:sz})}
  const mm=MAT_M[a.matiere]; if(mm&&mm!==1){p*=mm;F.push({k:"Matière : "+a.matiere.toLowerCase(),m:mm})}
  (a.details||[]).forEach(d=>{const x=DET_M[d];if(x&&x!==1){p*=x;F.push({k:d,m:x})}});
  const sf=seasonFactor(type); if(Math.abs(sf-1)>.01){p*=sf;F.push({k:sf>1?"Pleine saison":"Hors saison",m:sf})}
  if((a.defauts||"").trim()){p*=.88;F.push({k:"Défaut signalé",m:.88})}
  // recalage sur tes ventes
  let own=null, ownN=0, calib=1;
  if(a.marque){
    const same=db.articles.filter(x=>isSold(x)&&x.id!==a.id&&norm(brandName(x.marque))===norm(brandName(a.marque))&&num(x.prixVente)>0);
    const sameType=same.filter(x=>x.type===a.type);
    if(sameType.length){own=sum(sameType,x=>num(x.prixVente))/sameType.length;ownN=sameType.length}
    if(same.length>=2){ // ratio réalisé / estimé pour cette marque, toutes catégories
      const ratios=same.map(x=>{const e=estimateRaw(x);return e>0?num(x.prixVente)/e:null}).filter(v=>v&&isFinite(v));
      if(ratios.length>=2){const r=sum(ratios)/ratios.length;calib=Math.min(1.6,Math.max(.6,r));const w=ratios.length/(ratios.length+3);calib=1+(calib-1)*w;if(Math.abs(calib-1)>.02){p*=calib;F.push({k:`Tes ventes ${brandName(a.marque)} (${ratios.length})`,m:calib})}}
    }
  }
  let fair=p;
  if(own&&ownN){const w=ownN/(ownN+2);fair=fair*(1-w)+own*w;F.push({k:`Moyenne de tes ${ownN} vente(s) ${a.type} ${brandName(a.marque)} : ${fmtE0(own)}`,m:null,note:true})}
  const cost=artCost(a);
  const mid=nice(fair); let list=nice(fair*1.15), quick=nice(fair*.85); if(list<=mid) list=mid+1; if(quick>=mid&&mid>3) quick=mid-1;
  let floor=nice(Math.max(fair*.7, cost>0?cost*1.3+1:0)); if(floor>quick) floor=quick;
  let conf=0; if(br)conf+=2; else if(custom)conf+=0; if(a.type)conf+=1; if(a.etat)conf+=1; if(a.taille)conf+=1; if(a.matiere)conf+=.5; if(ownN)conf+=1.5;
  const confL=conf>=5.5?"haute":conf>=3.5?"moyenne":"faible";
  const margin=cost>0?mid-cost:null, mult=cost>0?mid/cost:null;
  return {list,mid,quick,floor,fair,F,own,ownN,conf:confL,known:!!br,custom,cost,margin,mult,brand:br};
}
function estimateRaw(a){ // estimation sans recalage ni historique (pour la calibration)
  const type=TYPES[a.type]?a.type:"Autre", br=brandOf(a.marque); let p=REF[type]*(br?TIER_MULT[br.tier]*br.adj:TIER_MULT[2]*.8);
  if(br&&br.hot[type])p*=br.hot[type]; p*=COND[a.etat]||1; p*=SIZE_M[a.taille]||1; p*=MAT_M[a.matiere]||1; (a.details||[]).forEach(d=>{p*=DET_M[d]||1}); return p }

/* photos in IndexedDB */
const Photos = {
  _db:null, cache:{},
  open(){ if(this._db) return Promise.resolve(this._db);
    return new Promise((res,rej)=>{ try{ const r=indexedDB.open("rayon-photos",1);
      r.onupgradeneeded=()=>r.result.createObjectStore("p");
      r.onsuccess=()=>{this._db=r.result;res(this._db)}; r.onerror=()=>rej(r.error);}catch(e){rej(e)} }) },
  async put(id,data){ try{const d=await this.open(); await new Promise((res,rej)=>{const t=d.transaction("p","readwrite");t.objectStore("p").put(data,id);t.oncomplete=res;t.onerror=()=>rej(t.error)}); this.cache[id]=data; return true}catch(e){return false} },
  async get(id){ if(this.cache[id]) return this.cache[id]; try{const d=await this.open(); return await new Promise(res=>{const r=d.transaction("p").objectStore("p").get(id); r.onsuccess=()=>{this.cache[id]=r.result||null;res(r.result||null)}; r.onerror=()=>res(null)})}catch(e){return null} },
  async del(id){ delete this.cache[id]; try{const d=await this.open(); d.transaction("p","readwrite").objectStore("p").delete(id)}catch(e){} }
};

/* ================= calculations ================= */
const lotById=id=>db.lots.find(l=>l.id===id);
const lotCost=l=>num(l.prix)+num(l.port)-num(l.reduction);
const lotArts=l=>db.articles.filter(a=>a.lotId===l.id);
const lotPieces=l=>num(l.pieces)>0?num(l.pieces):Math.max(1,lotArts(l).length);
function artCost(a){ if(has(a.coutManuel)) return num(a.coutManuel); const l=lotById(a.lotId); return l?lotCost(l)/lotPieces(l):0 }
const isSold=a=>a.statut==="Vendu";
const artProfit=a=>isSold(a)?num(a.prixVente)-artCost(a)-num(a.frais):null;
function artMinutes(a){ const S=db.settings; let m=0;
  m+= has(a.minAnnonce)?num(a.minAnnonce):(a.statut!=="En stock"?S.minAnnonce:0);
  if(isSold(a)) m+= has(a.minEnvoi)?num(a.minEnvoi):S.minEnvoi; return m }
function daysOnline(a){ if(!a.dateEnLigne) return null; return Math.max(0,days(a.dateEnLigne, isSold(a)&&a.dateVente?a.dateVente:today())) }

function stats(){
  const S=db.settings, A=db.articles, sold=A.filter(isSold);
  const s={};
  s.investLots=sum(db.lots,lotCost); s.depenses=sum(db.depenses,d=>num(d.montant)); s.frais=sum(A,a=>num(a.frais));
  s.out=s.investLots+s.depenses+s.frais;
  s.ca=sum(sold,a=>num(a.prixVente)); s.net=s.ca-s.out; s.benefVentes=sum(sold,artProfit);
  s.roi=s.out>0?s.net/s.out:NaN; s.recup=s.out>0?Math.min(1,s.ca/s.out):0; s.reste=Math.max(0,s.out-s.ca);
  const live=A.filter(a=>!isSold(a)&&a.statut!=="Invendable");
  s.stockCout=sum(live,artCost); s.stockPrix=sum(live,a=>num(a.prixAffiche)); s.potentiel=s.net+s.stockPrix;
  s.nTot=A.length; s.nSold=sold.length; s.nLigne=A.filter(a=>a.statut==="En ligne"||a.statut==="Réservé").length;
  s.nStock=A.filter(a=>a.statut==="En stock"||a.statut==="Retourné").length; s.nInv=A.filter(a=>a.statut==="Invendable").length;
  s.ecoul=s.nTot?s.nSold/s.nTot:NaN; s.panier=s.nSold?s.ca/s.nSold:NaN; s.benefMoy=s.nSold?s.benefVentes/s.nSold:NaN;
  s.marge=s.ca>0?s.benefVentes/s.ca:NaN;
  const mults=sold.filter(a=>artCost(a)>0).map(a=>num(a.prixVente)/artCost(a)); s.mult=mults.length?sum(mults)/mults.length:NaN;
  const dl=sold.map(daysOnline).filter(v=>v!==null&&v>=0); s.delai=dl.length?sum(dl)/dl.length:NaN; s.rapide=dl.length?Math.min(...dl):NaN;
  s.best=sold.length?Math.max(...sold.map(artProfit)):NaN; s.bestId=sold.length?sold.reduce((m,a)=>artProfit(a)>artProfit(m)?a:m).id:null;
  s.minArt=sum(A,artMinutes); s.minHors=sum(db.temps,t=>num(t.minutes)); s.min=s.minArt+s.minHors; s.h=s.min/60;
  s.eurh=s.h>0?s.net/s.h:NaN; s.eurhV=s.h>0?s.benefVentes/s.h:NaN; s.ecart=isFinite(s.eurhV)?s.eurhV-S.taux:NaN;
  s.valTemps=s.h*S.taux; s.netApres=s.net-s.valTemps; s.minParVente=s.nSold?sum(sold,artMinutes)/s.nSold:NaN;
  const t=today(), ym=t.slice(0,7), y=t.slice(0,4);
  s.moisBenef=sum(sold.filter(a=>(a.dateVente||"").startsWith(ym)),artProfit); s.moisCA=sum(sold.filter(a=>(a.dateVente||"").startsWith(ym)),a=>num(a.prixVente));
  s.moisN=sold.filter(a=>(a.dateVente||"").startsWith(ym)).length;
  s.objP=S.objectif>0?s.moisBenef/S.objectif:NaN;
  const sy=sold.filter(a=>(a.dateVente||"").startsWith(y)); s.dacN=sy.length; s.dacEur=sum(sy,a=>num(a.prixVente));
  // months
  const dates=[...db.lots.map(l=>l.date),...A.map(a=>a.dateVente||a.dateEnLigne),...db.depenses.map(d=>d.date)].filter(Boolean).sort();
  const start=dates[0]?pd(dates[0]):new Date(); const now=new Date();
  let cur=new Date(start.getFullYear(),start.getMonth(),1); const months=[];
  while(cur<=now||months.length<1){months.push(cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")); cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); if(months.length>24)break}
  const last=months.slice(-12); let cum=0;
  s.months=months.map(m=>{const sm=sold.filter(a=>(a.dateVente||"").startsWith(m));
    const ca=sum(sm,a=>num(a.prixVente)), bv=sum(sm,artProfit), out=sum(db.lots.filter(l=>(l.date||"").startsWith(m)),lotCost)+sum(db.depenses.filter(d=>(d.date||"").startsWith(m)),d=>num(d.montant))+sum(sm,a=>num(a.frais));
    cum+=ca-out; return {m,n:sm.length,ca,bv,out,cash:ca-out,cum,listed:A.filter(a=>(a.dateEnLigne||"").startsWith(m)).length}}).filter(x=>last.includes(x.m));
  // groups
  const grp=key=>{const g={};A.forEach(a=>{const k=key(a)||"—";(g[k]=g[k]||{k,n:0,sold:0,ca:0,b:0,dl:[]});const o=g[k];o.n++;if(isSold(a)){o.sold++;o.ca+=num(a.prixVente);o.b+=artProfit(a);const d=daysOnline(a);if(d!==null)o.dl.push(d)}});
    return Object.values(g).map(o=>({...o,ecoul:o.n?o.sold/o.n:0,bm:o.sold?o.b/o.sold:NaN,delai:o.dl.length?sum(o.dl)/o.dl.length:NaN}))};
  s.byType=grp(a=>a.type).sort((a,b)=>b.b-a.b||b.n-a.n);
  s.byBrand=grp(a=>a.marque&&brandName(a.marque)).sort((a,b)=>b.b-a.b||b.n-a.n);
  s.statusCounts=STATUTS.map(st=>A.filter(a=>a.statut===st).length);
  return s;
}

function alerts(s){
  const S=db.settings, out=[];
  db.lots.filter(l=>l.statut==="En route").forEach(l=>out.push({k:"info",ic:"📦",t:`Réceptionner ${l.ref}`,d:`${l.fournisseur} · en route`,act:"receive",id:l.id}));
  db.lots.filter(l=>l.statut==="Reçu"&&num(l.pieces)>0&&lotArts(l).length<num(l.pieces)).forEach(l=>out.push({k:"warn",ic:"✏️",t:`${num(l.pieces)-lotArts(l).length} à saisir`,d:`${l.ref} · ${l.fournisseur}`,act:"rafale",id:l.id}));
  const old=db.articles.filter(a=>a.statut==="En ligne"&&daysOnline(a)>=S.alerteJours);
  if(old.length) out.push({k:"warn",ic:"📉",t:`${old.length} à relancer`,d:`en ligne depuis ${S.alerteJours} j+`,act:"filter",id:"old"});
  const stock=db.articles.filter(a=>a.statut==="En stock");
  if(stock.length) out.push({k:"info",ic:"🚀",t:`${stock.length} à publier`,d:"pas encore en ligne",act:"filter",id:"En stock"});
  const resv=db.articles.filter(a=>a.statut==="Réservé"); if(resv.length) out.push({k:"info",ic:"🤝",t:`${resv.length} réservé${resv.length>1?"s":""}`,d:"à confirmer vendu",act:"filter",id:"Réservé"});
  if(s.dacN>=S.dacN*.8||s.dacEur>=S.dacEur*.8) out.push({k:s.dacN>=S.dacN||s.dacEur>=S.dacEur?"bad":"warn",ic:"🧾",t:s.dacN>=S.dacN||s.dacEur>=S.dacEur?"Seuil DAC7 atteint":"DAC7 proche",d:`${s.dacN}/${S.dacN} ventes · ${fmtE0(s.dacEur)}`,act:"sec",id:"mois"});
  if(s.nTot>0&&s.reste===0) out.push({k:"good",ic:"🎉",t:"Mise remboursée",d:"tout le reste est du bénéfice",act:null});
  const lb=db.lastBackup?days(db.lastBackup.slice(0,10),today()):null;
  if(db===real&&(db.articles.length>=5)&&(lb===null||lb>=14)) out.push({k:"warn",ic:"💾",t:"Sauvegarder",d:lb===null?"jamais fait":"il y a "+lb+" j",act:"nav",id:"backup"});
  return out;
}

/* ================= annonce generator ================= */
function rng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const tagify=s=>"#"+norm(s).replace(/ /g,"");
function genAnnonce(a,ton,seed){
  const r=rng(seed), S=db.settings;
  const t=TYPES[a.type]||TYPES.Autre, br=brandOf(a.marque), e=ETATS[a.etat]||ETATS["Très bon état"];
  const marque=br&&br.name==="Sans marque"?"":brandName(a.marque), type=a.type||"Pièce", typeL=type.toLowerCase();
  const ce=t.g==="f"?"Cette":"Ce", un=t.g==="f"?"une":"un";
  const det=a.details||[], coul=(a.couleur||"").toLowerCase();
  const keyDet=det.find(d=>["Col camionneur","Capuche","Zippé","Col V","Grand logo","Logo brodé","Vintage"].includes(d));
  const month=new Date().getMonth()+1, coldSeason=month>=9||month<=3;
  // title
  const parts=[type==="Gilet / Zip"?(det.includes("Zippé")?"Zip":"Gilet"):type, marque];
  if(keyDet&&keyDet!=="Logo brodé"&&ton!=="express") parts.push(keyDet.toLowerCase());
  if(coul) parts.push(coul);
  if(ton==="pepite"&&det.includes("Vintage")&&!parts.includes("vintage")) parts.push("vintage");
  parts.push(a.taille?"T. "+a.taille:"");
  let titre=parts.filter(Boolean).join(" ").replace(/\s+/g," ");
  if(a.etat==="Neuf avec étiquette") titre+=" neuf";
  // lines
  const L=[];
  const styleLine=br&&br.sigs.length&&marque?pick(r,br.sigs):"";
  const originLine=br&&br.origin&&br.tier>=4&&marque?`Marque ${br.origin==="France"?"française":br.origin==="Italie"?"italienne":br.origin==="Royaume-Uni"?"britannique":br.origin==="États-Unis"?"américaine":"de "+br.origin}, ${br.style}.`:"";
  const seasonLine = t.warm&&coldSeason ? pick(r,["Pile la bonne saison pour le porter.","Parfait pour l'automne et l'hiver.","Idéal pour les journées fraîches."]) : (!t.warm&&!coldSeason?pick(r,["Parfait pour la belle saison.","Idéal pour les beaux jours."]):"");
  const matLine=a.matiere?`${a.matiere}`:"";
  const fitLine=det.includes("Oversize")?"coupe oversize":det.includes("Coupe ajustée")?"coupe ajustée":"";
  const mes=[]; if(has(a.mesure1)) mes.push(`largeur à plat ${num(a.mesure1)} cm`); if(has(a.mesure2)) mes.push(`longueur ${num(a.mesure2)} cm`);
  const defaut=(a.defauts||"").trim();
  const extraDet=det.filter(d=>!["Oversize","Coupe ajustée"].includes(d));
  const lotLine=S.remiseLot>0?`-${S.remiseLot} % dès 2 articles achetés ensemble, jette un œil à mon dressing.`:"Jette un œil à mon dressing, je fais des lots.";
  if(ton==="pepite"){
    L.push(pick(r,[`🔥 ${ce} ${typeL} ${marque} va partir vite.`,`✨ Coup de cœur : ${typeL} ${marque} ${coul} en ${a.etat?a.etat.toLowerCase():"très bon état"}.`,`🔥 ${cap(un)} ${typeL} ${marque} comme on les aime.`]));
    if(styleLine) L.push(cap(styleLine)+(seasonLine?". "+seasonLine:"."));
    else if(seasonLine) L.push(seasonLine);
    if(originLine) L.push(originLine);
    L.push("");
    if(marque) L.push(`✔️ Marque : ${marque}`);
    if(a.taille) L.push(`✔️ Taille : ${a.taille}${fitLine?" ("+fitLine+")":""}`);
    if(a.etat) L.push(`✔️ État : ${a.etat.toLowerCase()}, ${e.d}`);
    if(matLine) L.push(`✔️ Matière : ${matLine}`);
    if(a.couleur) L.push(`✔️ Couleur : ${coul}`);
    if(extraDet.length) L.push(`✔️ Détails : ${extraDet.map(d=>d.toLowerCase()).join(", ")}`);
    if(mes.length) L.push(`📏 Mesures : ${mes.join(" · ")}`);
    if(defaut) L.push(`⚠️ À noter : ${defaut} (visible en photo)`); else if(e.clean) L.push("👌 Aucun défaut, prêt à porter.");
    L.push(""); L.push("📦 Envoi rapide et soigné sous 24/48 h.");
    L.push("💬 "+lotLine);
  } else if(ton==="clean"){
    L.push(`${cap(un)} ${typeL} ${marque}${coul?" "+coul:""}${a.taille?", taille "+a.taille:""}.`);
    const s2=[]; if(styleLine) s2.push(cap(styleLine)); if(matLine) s2.push(`en ${matLine.toLowerCase()}`);
    if(s2.length) L.push(s2.join(", ")+(fitLine?", "+fitLine:"")+".");
    L.push(`État : ${a.etat?a.etat.toLowerCase():"très bon état"}, ${e.d}.`);
    if(extraDet.length) L.push(`Détails : ${extraDet.map(d=>d.toLowerCase()).join(", ")}.`);
    if(mes.length) L.push(`Mesures à plat : ${mes.join(", ")}.`);
    if(defaut) L.push(`Défaut à signaler : ${defaut}, visible sur les photos.`);
    if(seasonLine) L.push(seasonLine);
    L.push(""); L.push("Vêtement propre, envoyé plié avec soin sous 24/48 h.");
    L.push(lotLine);
  } else {
    L.push(`${type} ${marque}${a.taille?" · taille "+a.taille:""}${coul?" · "+coul:""}`);
    L.push(`${a.etat||"Très bon état"}${defaut?" · "+defaut:""}`);
    if(mes.length) L.push(`📏 ${mes.join(" · ")}`);
    L.push("📦 Envoi 24/48 h · "+(S.remiseLot>0?`-${S.remiseLot} % en lot`:"lots possibles"));
  }
  const tags=new Set();
  if(br) br.tags.forEach(x=>tags.add("#"+x)); else if(marque) tags.add(tagify(marque));
  tags.add("#"+t.tag); if(coul) tags.add(tagify(coul.split(" ")[0]));
  if(det.includes("Vintage")) tags.add("#vintage");
  if(t.warm&&coldSeason) tags.add("#automne");
  tags.add("#homme");
  const hashtags=[...tags].slice(0,ton==="express"?5:9).join(" ");
  return {titre:titre.slice(0,90),desc:L.join("\n").replace(/ {2,}/g," ").replace(/ ([.,])/g,"$1").replace(/\n{3,}/g,"\n\n"),hashtags};
}

function artThumb(a){
  const init=esc((a.marque||a.type||"?").trim().charAt(0).toUpperCase());
  return `<div class="thumb">${a.photo?`<img data-photo="${a.id}" alt="">`:init}</div>`;
}
function artLine(a){
  const d=daysOnline(a), S=db.settings;
  const right=isSold(a)?`<span class="price ${sgn(artProfit(a))}">${fmtSigned(artProfit(a))}</span>`:`<span class="price">${has(a.prixAffiche)?fmtE0(num(a.prixAffiche)):"–"}</span>`;
  const sub=[a.type,a.taille,a.etat].filter(Boolean).join(" · ");
  const age=a.statut==="En ligne"&&d!==null?` · <span class="${d>=S.alerteJours?"neg":""}">J+${d}</span>`:isSold(a)&&a.dateVente?` · vendu le ${fmtD(a.dateVente)}`:"";
  const act=(cls,act,ic,label)=>`<button class="sw-act ${cls}" data-act="${act}" data-id="${a.id}"><i>${ic}</i><small>${label}</small></button>`;
  let L="",R="";
  if(a.statut==="En ligne"||a.statut==="Réservé"){ L=act("good","sell","✓","Vendu")+act("tag","annonce",IC.spark,"Annonce"); R=act("warn","drop-price","−10 %","Baisser") }
  else if(a.statut==="En stock"||a.statut==="Retourné"){ L=act("info","publish","🚀","Publier")+act("tag","annonce",IC.spark,"Annonce"); R=act("neutral","mark-inv","✕","Invendable") }
  else if(a.statut==="Vendu"){ L=act("neutral","dup-art","⧉","Dupliquer"); R=act("violet","mark-retour","↩","Retour") }
  else { L=act("bad","del-art-now","🗑","Supprimer"); R=act("info","mark-stock","↺","En stock") }
  return `<div class="sw" data-swid="${a.id}"><div class="sw-acts l">${L}</div>${R?`<div class="sw-acts r">${R}</div>`:""}<div class="sw-body"><button class="item" data-act="open-art" data-id="${a.id}">${artThumb(a)}
    <div class="mid"><div class="t1">${esc(brandName(a.marque)||"Sans marque")}</div><div class="t2">${esc(sub)}${age}</div><div class="t2 mono">${esc(a.ref)}${a.lotId&&lotById(a.lotId)?" · "+esc(lotById(a.lotId).ref):""}</div></div>
    <div class="rt">${right}<span class="pill ${ST_CLASS[a.statut]}">${a.statut}</span></div></button></div></div>`;
}
function viewStock(){
  const S=db.settings, q=norm(ui.q);
  let L=db.articles.slice();
  if(ui.filter==="old") L=L.filter(a=>a.statut==="En ligne"&&daysOnline(a)>=S.alerteJours);
  else if(ui.filter==="dispo") L=L.filter(a=>!isSold(a)&&a.statut!=="Invendable");
  else if(ui.filter!=="Tous") L=L.filter(a=>a.statut===ui.filter);
  if(q) L=L.filter(a=>norm([a.marque,a.type,a.taille,a.couleur,a.ref,a.notes].join(" ")).includes(q));
  const sorts={recent:(a,b)=>(b.created||0)-(a.created||0),prix:(a,b)=>num(b.prixVente||b.prixAffiche)-num(a.prixVente||a.prixAffiche),
    age:(a,b)=>(daysOnline(b)??-1)-(daysOnline(a)??-1),benef:(a,b)=>(artProfit(b)??-999)-(artProfit(a)??-999),marque:(a,b)=>(a.marque||"").localeCompare(b.marque||"")};
  L.sort(sorts[ui.sort]||sorts.recent);
  const counts=st=>db.articles.filter(a=>a.statut===st).length;
  const filters=["Tous",...STATUTS];
  return `
  <div class="sec-h" style="margin-top:6px"><h2 style="font-size:24px">Stock</h2><span class="eyebrow">${db.articles.length} pièce${db.articles.length>1?"s":""}</span></div>
  <div class="toolbar">
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Marque, type, réf…" value="${esc(ui.q)}" aria-label="Rechercher"></label>
    <select class="inp" id="sort" style="width:auto;height:44px" aria-label="Trier">
      ${[["recent","Récents"],["prix","Prix"],["age","Plus anciens en ligne"],["benef","Bénéfice"],["marque","Marque A-Z"]].map(([k,l])=>`<option value="${k}" ${ui.sort===k?"selected":""}>${l}</option>`).join("")}
    </select>
  </div>
  <div class="chips">${filters.map(f=>`<button class="chip ${ui.filter===f?"on":""}" data-act="filter" data-id="${f}">${f}<span class="n">${f==="Tous"?db.articles.length:counts(f)}</span></button>`).join("")}
    ${ui.filter==="old"?`<button class="chip on" data-act="filter" data-id="Tous">En ligne depuis longtemps ✕</button>`:ui.filter==="dispo"?`<button class="chip on" data-act="filter" data-id="Tous">Disponibles ✕</button>`:""}</div>
  ${ui.filter==="old"?`<div class="banner">Ces pièces sont en ligne depuis ${S.alerteJours} jours ou plus. Baisse le prix de 10 à 15 %, change la 1re photo ou relance l'annonce.</div>`:ui.filter==="En stock"&&L.length?`<div class="banner">Pas encore en ligne : ouvre une pièce, génère l'annonce et publie-la. Le bouton 🚀 fait ça en un geste.</div>`:ui.filter==="Réservé"&&L.length?`<div class="banner">Dès que le paiement est validé, le ✓ marque la pièce vendue.</div>`:""}
  ${L.length&&!uiPrefs.swipeHint?`<div class="banner hint-sw" id="swipeHint">👈 Glisse une pièce vers la gauche pour la vendre, la publier ou générer l'annonce. 👉 Vers la droite pour baisser le prix ou la marquer invendable. À fond : l'action part directement. <button type="button" data-act="hint-ok">OK</button></div>`:""}
  <div class="list">${L.length?L.map(artLine).join(""):`<div class="empty"><h3>${db.articles.length?"Rien ici":"Ton stock est vide"}</h3><p>${db.articles.length?"Aucune pièce ne correspond à ce filtre.":"Quand ta box arrive, ouvre « Lots » et lance la réception : tu ajouteras les pièces en rafale."}</p>${db.articles.length?"":`<button class="btn pri" data-act="new-art">Ajouter une pièce</button>`}</div>`}</div>`;
}

function lotCard(l){
  const arts=lotArts(l), sold=arts.filter(isSold), ca=sum(sold,a=>num(a.prixVente)), fr=sum(arts,a=>num(a.frais)), cost=lotCost(l);
  const ben=ca-fr-cost, rec=cost>0?Math.min(1,(ca-fr)/cost):0, pcs=num(l.pieces);
  const st=l.statut==="En route"?`<span class="pill st-ligne">En route</span>`:ben>=0&&sold.length?`<span class="pill st-vendu">Rentabilisé</span>`:`<span class="pill st-reserve">En cours</span>`;
  return `<div class="card" style="margin-bottom:10px">
    <div style="display:flex;gap:10px;align-items:flex-start">
      <div style="flex:1;min-width:0"><div class="mono muted">${esc(l.ref)} · ${fmtD(l.date)}${l.facture?" · "+esc(l.facture):""}</div><h3 style="font-size:18px;margin-top:2px">${esc(l.fournisseur)}</h3><div class="muted" style="font-size:14px">${esc(l.nom||"")}</div></div>
      ${st}
    </div>
    <div class="stats3">
      <div class="mini"><div class="l">Coût</div><div class="v">${fmtE(cost)}</div></div>
      <div class="mini"><div class="l">/ pièce</div><div class="v">${pcs>0||arts.length?fmtE(cost/lotPieces(l)):"–"}</div></div>
      <div class="mini"><div class="l">Bénéfice</div><div class="v ${sgn(ben)}">${fmtSigned(ben)}</div></div>
    </div>
    <div class="lbl" style="display:flex;justify-content:space-between"><span>Mise récupérée</span><span class="num">${fmtP(rec)}</span></div>
    <div class="pbar ${rec>=1?"good":""}" style="margin:6px 0 10px"><span style="width:${rec*100}%"></span></div>
    <div class="muted" style="font-size:13px">${pcs>0?`${pcs} pièces reçues · `:""}${arts.length} saisies · ${sold.length} vendues · ${fmtE(ca)} encaissés${num(l.poids)>0?` · ${fmtE(cost/num(l.poids))}/kg`:""}</div>
    <div class="btns" style="margin-top:12px">
      ${l.statut==="En route"?`<button class="btn sm tag" data-act="receive" data-id="${l.id}">Réceptionner</button>`:`<button class="btn sm pri" data-act="rafale" data-id="${l.id}">+ Pièces</button>`}
      <button class="btn sm" data-act="lot-stock" data-id="${l.id}">Voir les pièces</button>
      <button class="btn sm" data-act="edit-lot" data-id="${l.id}">Modifier</button>
    </div></div>`;
}
function viewLots(){
  return `<div class="sec-h" style="margin-top:6px"><h2 style="font-size:24px">Lots</h2><button class="btn sm pri" data-act="edit-lot">+ Nouveau lot</button></div>
  ${db.lots.length?db.lots.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(lotCard).join(""):`<div class="empty"><h3>Aucun lot</h3><p>Ajoute ta première box pour suivre ce qu'elle te rapporte.</p></div>`}`;

/* ================= router ================= */
function go(v){ui.view=v;document.querySelectorAll("[data-nav]").forEach(b=>b.classList.toggle("on",b.dataset.nav===v));render();try{window.scrollTo(0,0)}catch(_){}}
function render(){
  destroyCharts();
  const V={home:viewHome,stock:viewStock,lots:viewLots,more:viewMore}[ui.view]||viewHome;
  $("#main").innerHTML=V();
  $("#demoBand").hidden=db===real;
  if(ui.view==="home") drawCharts();
  if(ui.view==="stock") swPeek();
  hydratePhotos($("#main"));
  updChrono();
}
async function hydratePhotos(root){ for(const img of root.querySelectorAll("img[data-photo]")){ const d=await Photos.get(img.dataset.photo); if(d) img.src=d; else img.parentElement.textContent="•" } }

function destroyCharts(){ui.charts.forEach(c=>{try{c.destroy()}catch(e){}});ui.charts=[]}
function emptyChart(id,msg){const c=document.getElementById(id);if(c)c.parentElement.innerHTML=`<div class="empty-chart">${msg}</div>`}
function drawCharts(){
  const s=stats();
  if(!window.Chart){["cMonths","cStatus","cTypes","cBrands"].forEach(id=>emptyChart(id,"Les graphiques se chargent avec une connexion internet."));return}
  const ink=cssv("--ink"), muted=cssv("--muted"), line=cssv("--line"), acc=cssv("--accent"), tag=cssv("--tag");
  Chart.defaults.font.family=cssv("--f-body"); Chart.defaults.color=muted; Chart.defaults.font.size=11;
  const eur=v=>fmtE0(v);
  // months
  if(s.months.length&&(s.months.some(m=>m.ca||m.out))){
    const labels=s.months.map(m=>pd(m.m+"-01").toLocaleDateString("fr-FR",{month:"short"}).replace(".",""));
    ui.charts.push(new Chart($("#cMonths"),{data:{labels,datasets:[
      {type:"bar",label:"CA",data:s.months.map(m=>m.ca),backgroundColor:acc,borderRadius:6,maxBarThickness:22,order:2},
      {type:"bar",label:"Bénéfice ventes",data:s.months.map(m=>m.bv),backgroundColor:tag,borderRadius:6,maxBarThickness:22,order:3},

let sheetOnClose=null;
/* ---------- Swipe actions (façon iOS) ---------- */
const SW={el:null,open:null,x0:0,y0:0,x:0,axis:null,w:0,awL:0,awR:0,suppress:false,raf:0,side:null,startX:0,vx:0,lastX:0,lastT:0};
const SPRING="transform .32s cubic-bezier(.22,1.1,.36,1)";
function swBody(el){return el.querySelector(".sw-body")}
function swClose(el,instant){ if(!el) return; const b=swBody(el); b.style.transition=instant?"none":SPRING; b.style.transform="translateX(0)"; el.classList.remove("open","full","full-r","drag","left","right"); el.style.removeProperty("--p"); if(SW.open===el) SW.open=null }
function swPaint(){ SW.raf=0; const el=SW.el; if(!el) return; const x=SW.x; swBody(el).style.transform=`translateX(${x}px)`;
  const side=x<0?"left":x>0?"right":null; if(side!==SW.side){ SW.side=side; el.classList.toggle("left",side==="left"); el.classList.toggle("right",side==="right") }
  const aw=side==="left"?SW.awL:SW.awR; el.style.setProperty("--p",aw?Math.min(1,Math.abs(x)/aw).toFixed(3):0);
  const raw=SW.raw||0; const fullL=raw<-SW.w*.5&&SW.awL>0, fullR=raw>SW.w*.5&&SW.awR>0;
  if(fullL!==el.classList.contains("full")){ el.classList.toggle("full",fullL); if(fullL) buzz(8) }
  if(fullR!==el.classList.contains("full-r")){ el.classList.toggle("full-r",fullR); if(fullR) buzz(8) }
}
function rubber(d,limit){ return d<=limit?d:limit+(d-limit)*0.45 }
document.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0) return;
  const body=e.target.closest(".sw-body"); const el=body&&body.closest(".sw");
  if(SW.open&&SW.open!==el&&!(e.target.closest(".sw")===SW.open)) swClose(SW.open);
  if(!el) return;
  const L=el.querySelector(".sw-acts.l"), R=el.querySelector(".sw-acts.r");
  SW.el=el; SW.x0=e.clientX; SW.y0=e.clientY; SW.axis=null; SW.side=null; SW.w=el.offsetWidth; SW.awL=L?L.offsetWidth:0; SW.awR=R?R.offsetWidth:0;
  const cur=swBody(el).style.transform.match(/-?[\d.]+/); SW.startX=el.classList.contains("open")&&cur?parseFloat(cur[0]):0; SW.x=SW.startX;
  SW.lastX=e.clientX; SW.lastT=e.timeStamp; SW.vx=0; body.style.transition="none";
},{passive:true});
document.addEventListener("pointermove",e=>{
  const el=SW.el; if(!el) return;
  const dx=e.clientX-SW.x0, dy=e.clientY-SW.y0;
  if(!SW.axis){ if(Math.abs(dx)<5&&Math.abs(dy)<5) return; SW.axis=Math.abs(dx)>Math.abs(dy)*1.15?"x":"y"; if(SW.axis==="x"){ el.classList.add("drag"); try{swBody(el).setPointerCapture(e.pointerId)}catch(_){} } }
  if(SW.axis!=="x") return;
  let x=SW.startX+dx; SW.raw=x;
  if(x<0){ const lim=SW.awL||0; x=-rubber(-x,lim); if(!SW.awL) x=-rubber(-x,0)*.5; if(x<-SW.w*.92) x=-SW.w*.92 }
  else if(x>0){ const lim=SW.awR||0; x=rubber(x,lim); if(!SW.awR) x=x*.5; if(x>SW.w*.92) x=SW.w*.92 }
  const dt=e.timeStamp-SW.lastT; if(dt>0){ SW.vx=(e.clientX-SW.lastX)/dt; SW.lastX=e.clientX; SW.lastT=e.timeStamp }
  SW.x=x; if(!SW.raf) SW.raf=requestAnimationFrame(swPaint);
},{passive:true});
function swFire(el,btn,dir){ const b=swBody(el); b.style.transition="transform .18s ease-out"; b.style.transform=`translateX(${dir*SW.w}px)`; el.classList.remove("full","full-r"); buzz(18); markSwipeLearned();
  setTimeout(()=>{ swClose(el,true); if(btn) btn.click() },150) }
function swEnd(e,cancel){
  const el=SW.el; if(!el) return; SW.el=null; if(SW.raf){cancelAnimationFrame(SW.raf);SW.raf=0;swPaint.call(null)}
  if(SW.axis){ SW.suppress=true; setTimeout(()=>SW.suppress=false,350) }
  el.classList.remove("drag");
  if(SW.axis!=="x") return;
  if(cancel){ swClose(el); return }
  const x=SW.x, v=SW.vx, raw=SW.raw||0; // px/ms
  const L=el.querySelector(".sw-acts.l"), R=el.querySelector(".sw-acts.r");
  if(x<0&&L){ if(el.classList.contains("full")||(v<-1.2&&raw<-SW.w*.3)) return swFire(el,L.querySelector(".sw-act"),-1);
    if(x<-SW.awL*.4||v<-.5){ swBody(el).style.transition=SPRING; swBody(el).style.transform=`translateX(${-SW.awL}px)`; el.style.setProperty("--p",1); el.classList.add("open"); SW.open=el; buzz(6); markSwipeLearned(); return } }
  if(x>0&&R){ if(el.classList.contains("full-r")||(v>1.2&&raw>SW.w*.3)) return swFire(el,R.querySelector(".sw-act"),1);
    if(x>SW.awR*.4||v>.5){ swBody(el).style.transition=SPRING; swBody(el).style.transform=`translateX(${SW.awR}px)`; el.style.setProperty("--p",1); el.classList.add("open"); SW.open=el; buzz(6); markSwipeLearned(); return } }
  swClose(el);
}
document.addEventListener("pointerup",e=>swEnd(e,false),{passive:true});
document.addEventListener("pointercancel",e=>swEnd(e,true),{passive:true});
document.addEventListener("click",e=>{ if(SW.suppress&&e.target.closest(".sw-body")){e.stopPropagation();e.preventDefault();SW.suppress=false;return}
  if(SW.open){ const inBody=e.target.closest(".sw-body"); if(inBody&&inBody.closest(".sw")===SW.open){ e.stopPropagation(); e.preventDefault(); swClose(SW.open); return } if(!e.target.closest(".sw-acts")) swClose(SW.open) } },true);
function markSwipeLearned(){ if(!uiPrefs.swipeHint){ uiPrefs.swipeHint=1; uiSave(); const h=$("#swipeHint"); if(h) h.remove() } }
function swPeek(){ if(uiPrefs.swipeHint) return; const el=document.querySelector(".list .sw"); if(!el) return; const b=swBody(el); setTimeout(()=>{ el.classList.add("left"); el.style.setProperty("--p","1"); b.style.transition="transform .4s cubic-bezier(.22,1.1,.36,1)"; b.style.transform="translateX(-80px)"; setTimeout(()=>{ b.style.transform="translateX(0)"; setTimeout(()=>el.classList.remove("left"),400) },700) },500) }

function toastUndo(msg,fn){ const t=$("#toast"); t.innerHTML=`<span>${esc(msg)}</span><button type="button" id="undoBtn">Annuler</button>`; t.classList.add("on","undo"); clearTimeout(toastT); clearTimeout(undoT);

/* pile de calques + bouton retour (Android / navigateur) */
const layers=[]; let popping=false, expectPop=0;
function pushLayer(n){ layers.push(n); try{history.pushState({layer:n,depth:layers.length},"")}catch(e){} }
function popLayer(n){ const i=layers.lastIndexOf(n); if(i<0) return; layers.splice(i,1); if(!popping){ expectPop++; try{history.back()}catch(e){expectPop--} } }
window.addEventListener("popstate",()=>{ if(expectPop>0){expectPop--;return} if(!layers.length) return; popping=true; const n=layers[layers.length-1]; if(n==="picker") closePicker(); else closeSheet(); popping=false; });
function openSheet(title,html,onClose,footer){
  $("#sheetTitle").textContent=title; $("#sheetBody").innerHTML=html; $("#sheetBody").scrollTop=0;
  const f=$("#sheetFoot"); f.innerHTML=footer||""; f.hidden=!footer;
  if(!sheetIsOpen){ sheetIsOpen=true; pushLayer("sheet") }
  $("#scrim").hidden=false; $("#sheet").hidden=false; sheetOnClose=onClose||null;
  requestAnimationFrame(()=>{$("#scrim").classList.add("on");$("#sheet").classList.add("on")});
  try{if(!matchMedia("(pointer:coarse)").matches){const f=$("#sheetBody").querySelector("input:not([type=file]):not([type=date]),select,textarea");if(f)setTimeout(()=>f.focus(),260)}}catch(e){}
  hydratePhotos($("#sheetBody"));
}
let sheetIsOpen=false;
function closeSheet(){
  if(!sheetIsOpen) return; sheetIsOpen=false;
  popLayer("sheet");
  $("#scrim").classList.remove("on");$("#sheet").classList.remove("on");
  setTimeout(()=>{$("#scrim").hidden=true;$("#sheet").hidden=true;$("#sheetBody").innerHTML=""},220);
  if(sheetOnClose){const f=sheetOnClose;sheetOnClose=null;f()}
}
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("undo");t.classList.add("on");clearTimeout(toastT);clearTimeout(undoT);toastT=setTimeout(()=>t.classList.remove("on"),2200)}

const pickState={q:"",onPick:null};
function openPicker(onPick,current){
  pickState.q=""; pickState.onPick=onPick; pickState.current=current||"";
  pushLayer("picker"); $("#picker").hidden=false; requestAnimationFrame(()=>$("#picker").classList.add("on"));
  drawPicker(); const i=$("#pickQ"); i.value=""; setTimeout(()=>i.focus(),200);
}
function closePicker(){ popLayer("picker"); $("#picker").classList.remove("on"); setTimeout(()=>{$("#picker").hidden=true},200) }
function drawPicker(){
  const q=norm(pickState.q); const S=db.settings; const recent=(S.recentBrands||[]).map(brandOf).filter(Boolean);
  const match=b=>!q||norm(b.name).includes(q)||b.aliases.some(x=>norm(x).includes(q))||norm(b.style).includes(q)||(q.length>=3&&b.tags.some(t=>t.includes(q.replace(/ /g,""))));
  let list=BRAND_LIST.filter(match);
  const score=b=>(norm(b.name).startsWith(q)?0:norm(b.name).includes(q)?1:2)+(b.pop?0:.5);
  if(q) list.sort((a,b)=>score(a)-score(b)||a.name.localeCompare(b.name,"fr"));
  const row=b=>`<button type="button" class="pk-row ${pickState.current&&brandName(pickState.current)===b.name?"on":""}" data-pick="${esc(b.name)}"><span class="pk-main"><b>${esc(b.name)}</b><small>${esc(b.style||"")}${b.origin?" · "+esc(b.origin):""}</small></span><span class="tier tier-${b.tier}">${TIER_LABEL[b.tier]}</span></button>`;
  let html="";
  if(!q&&recent.length) html+=`<div class="pk-h">Récentes</div>${recent.slice(0,6).map(row).join("")}`;
  if(!q){ html+=`<div class="pk-h">Courantes</div>${list.filter(b=>b.pop).map(row).join("")}<div class="pk-h">Toutes (${list.length})</div>${list.map(row).join("")}` }
  else html+=list.slice(0,40).map(row).join("");
  if(q&&pickState.q.trim().length>=2) html+=`<button type="button" class="pk-row custom" data-pick-custom="${esc(pickState.q.trim())}"><span class="pk-main"><b>Utiliser « ${esc(pickState.q.trim())} »</b><small>Marque hors catalogue : estimation moins fiable</small></span><span class="tier tier-0">Hors catalogue</span></button>`;
  if(!html) html=`<div class="empty">Aucune marque trouvée</div>`;
  $("#pickList").innerHTML=html;
}
function pickBrand(name){
  const S=db.settings; if(brandOf(name)){S.recentBrands=[brandName(name),...(S.recentBrands||[]).filter(x=>x!==brandName(name))].slice(0,8); save()}
  if(pickState.onPick) pickState.onPick(name); closePicker();
}

}
let pendingPhoto=null;

async function compress(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const M=1000;let w=img.width,h=img.height;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);res(c.toDataURL("image/jpeg",.75))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
}

async function saveArtForm(form,next){
  const id=form.dataset.id;
  let a=id?db.articles.find(x=>x.id===id):{id:uid(),created:Date.now()};
  const statut=readOpt("statut")||"En stock";
  const d={marque:val("fMarque"),type:readOpt("type"),taille:readOpt("taille"),etat:readOpt("etat"),couleur:readOpt("couleur"),matiere:val("fMatiere"),
    lotId:val("fLot"),details:readOpt("details"),mesure1:val("fM1"),mesure2:val("fM2"),defauts:val("fDef"),statut,
    prixAffiche:val("fPrix"),dateEnLigne:val("fEnLigne"),prixVente:val("fPV"),dateVente:val("fDV"),frais:val("fFrais"),
    minAnnonce:val("fMinA"),minEnvoi:val("fMinE"),coutManuel:val("fCout"),notes:val("fNotes")};
  if(statut==="Vendu"){ if(!d.dateVente) d.dateVente=today(); if(!has(d.prixVente)) d.prixVente=d.prixAffiche; if(!(num(d.prixVente)>0)){toast("Indique le prix de vente");return} if(!d.dateEnLigne) d.dateEnLigne=d.dateVente }
  if((statut==="En ligne"||statut==="Réservé")&&!d.dateEnLigne) d.dateEnLigne=today();
  const untouched=!d.marque&&!pendingPhoto&&!has(d.prixAffiche)&&!d.taille&&!d.couleur&&!d.notes;
  if(!id&&!next&&form.dataset.rafale==="1"&&untouched){closeSheet();render();return}
  if(!d.marque&&!d.type){toast("Indique au moins une marque ou un type");return}
  if(!id) a.ref=nextRef("a");
  Object.assign(a,d);
  if(pendingPhoto){ if(db===real){ const ok=await Photos.put(a.id,pendingPhoto); a.photo=ok; if(!ok) toast("Photo non enregistrée sur cet appareil") } else {Photos.cache[a.id]=pendingPhoto;a.photo=true} pendingPhoto=null }
  if(!id) db.articles.push(a);
  save();
  if(next){ toast(`${a.ref} enregistrée`); openArt(null,{rafale:true,lotId:a.lotId,preset:{type:a.type,etat:a.etat}}); render(); return }
  closeSheet(); toast(id?"Modifié":`${a.ref} ajoutée`); buzz(); render();
}

const annState={ton:"pepite",seed:1};
function annonceSheet(a){
  annState.seed=Math.floor(Math.random()*1e6);
  const draw=()=>{
    const g=genAnnonce(a,annState.ton,annState.seed);
    const missing=[!a.marque&&"marque",!a.type&&"type",!a.taille&&"taille",!a.couleur&&"couleur",!a.matiere&&"matière",!(has(a.mesure1)||has(a.mesure2))&&"mesures"].filter(Boolean);
    $("#sheetBody").innerHTML=`
      <div class="seg">${[["pepite","🔥 Pépite"],["clean","Sobre"],["express","Express"]].map(([k,l])=>`<button type="button" class="btn sm ${annState.ton===k?"pri":""}" data-act="ann-ton" data-v="${k}">${l}</button>`).join("")}</div>
      ${missing.length?`<p class="hint" style="margin:10px 0 0">Plus c'est précis, plus ça vend : il manque ${missing.join(", ")}. <button class="btn sm" data-act="open-art" data-id="${a.id}" style="height:28px">Compléter</button></p>`:""}
      <div class="out-h"><span class="lbl">Titre</span><button class="btn sm" data-act="copy" data-t="titre">${IC.copy} Copier</button></div>
      <div class="out" id="oTitre">${esc(g.titre)}</div>
      <div class="out-h"><span class="lbl">Description</span><button class="btn sm" data-act="copy" data-t="desc">${IC.copy} Copier</button></div>
      <div class="out" id="oDesc">${esc(g.desc)}\n\n${esc(g.hashtags)}</div>
      <div class="btns" style="margin-top:12px"><button class="btn" data-act="ann-shuffle">↻ Autre version</button><button class="btn pri" data-act="copy" data-t="all">${IC.copy} Tout copier</button></div>
      <div class="sec tip"><b>Pour vendre plus vite</b><ul style="padding-left:18px;margin:6px 0 0">
        <li>1re photo : la pièce entière, à plat ou portée, en lumière du jour sur fond neutre.</li>
        <li>Photographie l'étiquette de marque, l'étiquette taille/matière et chaque défaut.</li>
        <li>Prix conseillé : affiche ${fmtE0(suggestPrice(a).hi)}, accepte jusqu'à ${fmtE0(suggestPrice(a).lo)} en négo (plancher ${fmtE0(suggestPrice(a).e.floor)}).</li>
        <li>Sans vente au bout de ${db.settings.alerteJours} jours : baisse de 10 à 15 % ou change la 1re photo.</li></ul></div>`;
    a._ann=g;
  };
  openSheet(`Annonce · ${a.marque||a.type||"pièce"}`,"");

async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t);toast("Copié")}catch(e){
    const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();

}

}

let chronoI=null;
function updChrono(){
  const b=$("#chronoBtn");
  if(db.chrono){b.classList.add("live");const m=Math.floor((Date.now()-db.chrono)/1000);b.innerHTML=`<span class="dot"></span>${String(Math.floor(m/3600)).padStart(2,"0")!=="00"?Math.floor(m/3600)+":":""}${String(Math.floor(m%3600/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
    if(!chronoI)chronoI=setInterval(updChrono,1000)}
  else{b.classList.remove("live");b.innerHTML="⏱ Chrono";clearInterval(chronoI);chronoI=null}

function chronoToggle(){

/* demo data */
function makeDemo(){
  const d=JSON.parse(JSON.stringify(SEED)); const r=rng(42);
  const base=new Date(); const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  const ago=n=>{const x=new Date(base);x.setDate(x.getDate()-n);return iso(x)};
  d.lots=[{id:"d1",ref:"L001",date:ago(120),fournisseur:"Friptadium",nom:"Hauts Homme · Premium · 5 kg",poids:5,prix:109.99,reduction:10.99,port:9.49,pieces:16,statut:"Reçu"},
          {id:"d2",ref:"L002",date:ago(60),fournisseur:"Friptadium",nom:"Hauts Homme · Premium · 7 kg",poids:7,prix:149.99,reduction:0,port:11.9,pieces:22,statut:"Reçu"},
          {id:"d3",ref:"L003",date:ago(15),fournisseur:"Emmaüs Nice",nom:"Chine en boutique",prix:38,reduction:0,port:0,pieces:6,statut:"Reçu"}];
  const brands=["Ralph Lauren","Lacoste","Tommy Hilfiger","Carhartt","The North Face","Nike","Hugo Boss","Gant","Levi's","Napapijri","Champion","Fred Perry"];
  const types=["Pull","Sweat","Polo","Chemise","Hoodie","Veste","Gilet / Zip","T-shirt"];
  let n=0;
  d.lots.forEach(l=>{for(let i=0;i<l.pieces;i++){n++;
    const a={id:"a"+n,ref:"A"+String(n).padStart(3,"0"),created:n,lotId:l.id,marque:pick(r,brands),type:pick(r,types),taille:pick(r,["S","M","M","L","L","XL","XXL"]),etat:pick(r,["Très bon état","Très bon état","Bon état","Neuf sans étiquette"]),couleur:pick(r,["Bleu marine","Noir","Gris","Beige","Vert","Blanc"]),matiere:pick(r,["Coton","Laine","Coton / polyester"]),details:[]};
    const p=suggestPriceFor(a); a.prixAffiche=p;
    const lotAge=days(l.date,iso(base)); const roll=r();
    if(roll<(l.id==="d1"?.85:l.id==="d2"?.55:.2)){const on=Math.max(1,lotAge-Math.floor(r()*10)-3);const sell=Math.max(0,on-Math.floor(r()*Math.min(on,40)));
      a.statut="Vendu";a.dateEnLigne=ago(on);a.dateVente=ago(sell);a.prixVente=Math.round(p*(.8+r()*.25));a.frais=r()<.3?0.5:0;a.minAnnonce=8+Math.floor(r()*10)}
    else if(roll<.93){a.statut=r()<.12?"Réservé":"En ligne";a.dateEnLigne=ago(Math.floor(r()*Math.min(lotAge,45)))}
    else a.statut=r()<.4?"Invendable":"En stock";
    a.photo=true; Photos.cache[a.id]=demoPhoto(a);
    d.articles.push(a)}});
  d.depenses=[{id:"x1",date:ago(110),cat:"Emballage",montant:12.9,detail:"Pochettes x100"},{id:"x2",date:ago(50),cat:"Boost / Vitrine",montant:4.95,detail:"Vitrine 7 jours"}];
  d.temps=[{id:"t1",date:ago(115),minutes:90,label:"Tri du lot"},{id:"t2",date:ago(58),minutes:120,label:"Shooting photo"}];
  d.seq={a:n,l:3}; return d;
}

  if(e.target.id==="fMatiere"||e.target.id==="fLot") refreshSug();
  if(e.target.id==="fPhoto"&&e.target.files[0]){try{pendingPhoto=await compress(e.target.files[0]);$("#photoBox").innerHTML=`<img src="${pendingPhoto}" alt="Photo de l'article">`}catch(_){toast("Impossible de lire cette photo")}}
  if(e.target.id==="fileImport"&&e.target.files[0]){const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(e.target.files[0]);e.target.value=""}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#picker").hidden)closePicker();else if(!$("#sheet").hidden)closeSheet()}});

/* boot */
const h=(location.hash||"").slice(1); if(["home","stock","lots","more"].includes(h)) ui.view=h;
go(ui.view);
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>

</body>
</html>
