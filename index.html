<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rayon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B7A70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rayon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single mobile column (max 640px), sticky top bar, fixed bottom tab bar with a central "+" — the hero is a hang-tag (étiquette) showing net profit. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F5F8F6; --line:#D6DED9; --ink:#14211D; --muted:#5B6A64;
  --accent:#0B7A70; --accent-ink:#FFFFFF; --accent-soft:#D5EEEA;
  --tag:#E8B743; --tag-ink:#2E2200; --tag-line:#C99A2A;
  --good:#1E8549; --good-soft:#DCF1E3; --warn:#A86A12; --warn-soft:#FBEACB;
  --bad:#BF3B35; --bad-soft:#F8DCDA; --info:#2B67A8; --info-soft:#DCE7F4; --violet:#6F52AE; --violet-soft:#EAE3F6;
  --shadow:0 1px 2px rgba(20,33,29,.06),0 6px 20px rgba(20,33,29,.06);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --line:#293732; --ink:#E6EEEA; --muted:#98A9A2;
  --accent:#36C0B1; --accent-ink:#04201C; --accent-soft:#143A35;
  --tag:#EDC25B; --tag-ink:#271C00; --tag-line:#B8902E;
  --good:#4FC482; --good-soft:#15301F; --warn:#E6AA4B; --warn-soft:#3A2B12;
  --bad:#F2716A; --bad-soft:#3C1D1B; --info:#72A9E6; --info-soft:#172739; --violet:#B39BEA; --violet-soft:#29213D;
  --shadow:0 1px 0 rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1B2723; --line:#293732; --ink:#E6EEEA; --muted:#98A9A2;
  --accent:#36C0B1; --accent-ink:#04201C; --accent-soft:#143A35;
  --tag:#EDC25B; --tag-ink:#271C00; --tag-line:#B8902E;
  --good:#4FC482; --good-soft:#15301F; --warn:#E6AA4B; --warn-soft:#3A2B12;
  --bad:#F2716A; --bad-soft:#3C1D1B; --info:#72A9E6; --info-soft:#172739; --violet:#B39BEA; --violet-soft:#29213D;
  --shadow:0 1px 0 rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.02em}
.muted{color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:5px 5px 5px 11px;background:var(--tag);display:inline-block;position:relative;transform:rotate(-8deg)}
.brand i::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--bg);top:4px;left:4px}
.top .sp{flex:1}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip-btn.live{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.live .dot{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);align-items:center}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;padding:6px 0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.nav .plus{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto;transform:translateY(-14px);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
.nav .plus svg{width:26px;height:26px}

/* sections */
.sec{margin-top:22px;min-width:0}
.card{min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:18px}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.grid2.k4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;line-height:1.25}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:21px;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* hero tag */
.hero{position:relative;margin-top:8px;background:var(--tag);color:var(--tag-ink);border-radius:18px 18px 18px 46px;padding:20px 20px 18px 56px;overflow:hidden}
.hero::before{content:"";position:absolute;left:20px;top:22px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px var(--tag-line)}
.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:44px;border-right:2px dashed color-mix(in srgb,var(--tag-ink) 22%,transparent)}
.hero .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,58px);line-height:1;margin-top:6px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .sub{margin-top:8px;font-weight:600;font-size:14px}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--tag-ink) 14%,transparent);overflow:hidden;margin-top:14px}
.bar > span{display:block;height:100%;border-radius:99px;background:var(--tag-ink);transition:width .6s ease}
.hero .row{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-top:6px;opacity:.85}
.pbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.pbar > span{display:block;height:100%;background:var(--accent);border-radius:99px}
.pbar.warn > span{background:var(--warn)} .pbar.bad > span{background:var(--bad)} .pbar.good > span{background:var(--good)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:12px;font-size:14px;border:1px solid transparent;cursor:pointer;text-align:left;width:100%}
.alert b{display:block}
.alert.info{background:var(--info-soft);color:var(--ink)} .alert.info .ic{color:var(--info)}
.alert.warn{background:var(--warn-soft)} .alert.warn .ic{color:var(--warn)}
.alert.bad{background:var(--bad-soft)} .alert.bad .ic{color:var(--bad)}
.alert.good{background:var(--good-soft)} .alert.good .ic{color:var(--good)}
.alert .ic{flex:none;width:20px;height:20px;margin-top:1px}
.alert .go{margin-left:auto;flex:none;opacity:.5}

/* charts */
.chart-box{position:relative;height:220px}
.chart-box.sm{height:190px}
.empty-chart{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* list */
.toolbar{display:flex;gap:8px;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:5;background:var(--bg);padding:6px 0}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;contain:inline-size;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;width:100%}
.thumb{width:56px;height:56px;border-radius:10px;flex:none;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--muted);border:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.price{font-family:var(--f-display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st-stock{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.st-ligne{background:var(--info-soft);color:var(--info)}
.st-reserve{background:var(--warn-soft);color:var(--warn)}
.st-vendu{background:var(--good-soft);color:var(--good)}
.st-retour{background:var(--violet-soft);color:var(--violet)}
.st-inv{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.tag{background:var(--tag);color:var(--tag-ink);border-color:var(--tag-line)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px} .actgrid .btn{justify-content:center;white-space:nowrap}
.actgrid .btn:first-child:nth-last-child(odd){grid-column:1/-1}
.btns > .btn{flex:1 1 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.45);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:19px;flex:1;min-width:0}
.sheet-b{overflow-y:auto;min-height:0;flex:1 1 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sheet:has(.sheet-foot:not([hidden])) .sheet-b{padding-bottom:16px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0}

/* forms */
.fg{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.fg > label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;outline:0;font-size:16px}
textarea.inp{height:auto;min-height:90px;padding:10px 12px;line-height:1.45}
.inp:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:600;cursor:pointer}
.opt button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hint{font-size:12px;color:var(--muted)}
.suggest{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.suggest b{font-family:var(--f-display);font-size:18px}
.photo{width:100%;aspect-ratio:4/3;max-width:100%;border-radius:14px;border:1px dashed var(--line);background:var(--surface);display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative;color:var(--muted);font-weight:600}
.photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.photo-add{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer}
.photo-tools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px} .photo-tools .photo-chg{position:static}
.photo-chg{position:absolute;right:8px;bottom:8px;border:0;font-family:inherit;background:rgba(5,12,10,.72);color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
.photo-zoom{position:absolute;left:8px;bottom:8px;background:rgba(5,12,10,.72);color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;pointer-events:none}
.thumb img{cursor:zoom-in}
/* visionneuse plein écran */
.lb{position:fixed;inset:0;z-index:95;background:rgba(2,6,5,.96);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s;touch-action:none;overscroll-behavior:contain}
.lb.on{opacity:1}
.lb img{max-width:100vw;max-height:100vh;max-height:100dvh;object-fit:contain;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;will-change:transform;transition:transform .18s cubic-bezier(.22,1,.36,1)}
.lb.drag img{transition:none}
.lb-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff;font-size:14px;font-weight:600;background:linear-gradient(rgba(0,0,0,.5),transparent)}
.lb-top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;width:38px;height:38px;font-size:18px;display:grid;place-items:center;cursor:pointer}
.lb-hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:12px;pointer-events:none}
/* studio photo */
.st-wrap{position:relative;width:100%;aspect-ratio:1;background:#111;border-radius:14px;overflow:hidden;touch-action:none;contain:inline-size}
.st-wrap canvas{width:100%;height:100%;display:block}
.st-wrap.r45{aspect-ratio:4/5}
.st-row{display:grid;grid-template-columns:76px 1fr 44px;align-items:center;gap:10px;font-size:13px;margin:6px 0}
.st-row input[type=range]{width:100%;accent-color:var(--accent)}
.st-row .mono{text-align:right;color:var(--muted)}
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.st-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;contain:inline-size}
.st-th{position:relative;flex:none;width:58px;height:58px;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:var(--surface-2);padding:0;cursor:pointer;display:grid;place-items:center;font-size:24px;color:var(--accent);font-weight:800}
.st-th img{width:100%;height:100%;object-fit:cover} .st-th.on{border-color:var(--accent)} .st-th i{position:absolute;left:4px;top:3px;font-style:normal;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.st-hint{font-size:12px;color:var(--muted);margin-top:6px}
/* projection */
.proj{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.proj .pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.proj .pc.on{border-color:var(--accent);background:var(--accent-soft)}
.proj .pl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.proj .pv{font-family:var(--f-display);font-weight:800;font-size:19px;margin-top:4px}
.proj .ps{font-size:11px;color:var(--muted);margin-top:2px}
.proj-rows{display:grid;gap:6px;font-size:14px}
.proj-rows div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.proj-rows b{font-family:var(--f-mono)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.mini .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.mini .v{font-family:var(--f-display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}

/* annonce */
.out{contain:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.5;word-break:break-word}
.out-h{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.tip{font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tip li{margin:3px 0}

/* table */
.tbl-w{overflow-x:auto;contain:inline-size;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}

function seasonFactor(type){ const t=TYPES[type]; if(!t) return 1; const m=new Date().getMonth()+1; const cold=m>=10||m<=2, shoulder=m===3||m===9, hot=m>=5&&m<=7;
  const summer={"T-shirt":1,"Short":1,"Bermuda":1,"Maillot de bain":1,"Débardeur":1,"Top":1,"Robe":1,"Jupe":1,"Combinaison":1,"Sandales":1,"Espadrilles":1,"Claquettes / Tongs":1,"Lunettes de soleil":1}[type];
  if(t.warm) return cold?1.1:shoulder?1.03:hot?.85:.95; if(summer) return hot?1.08:cold?.9:1; return 1 }
function nice(v){ v=Math.max(2,v); if(v<15) return Math.round(v); if(v<40) return Math.round(v); return Math.round(v/5)*5 }
function estimate(a){
  const type=TYPES[a.type]?a.type:"Autre", br=brandOf(a.marque), custom=!!(a.marque&&!br);
  const F=[]; // facteurs expliqués
  const tier=br?br.tier:2; const neufOK=num(a.prixNeuf)>0; const retail=neufOK?num(a.prixNeuf):br?retailOf(br,type):TIER_RP[2]*(custom?.8:.6)*(TYPE_RF[type]||.8);
  F.push({k:`${br?`${br.name} · ${TIER_LABEL[br.tier]}`:custom?`${a.marque} · marque hors catalogue`:"Marque non renseignée"} · ${a.type||"catégorie ?"} neuf ${neufOK?"(renseigné)":"≈"}`,m:null,base:retail});
  const ret=RET[tier]; let p=retail*ret;
  F.push({k:`Cote seconde main ${TIER_LABEL[tier].toLowerCase()} (très bon état)`,m:null,base:p});
  if(br&&br.hot[type]){p*=br.hot[type];F.push({k:`${br.name} très recherché en ${type.toLowerCase()}`,m:br.hot[type]})}
  const c=COND[a.etat]||1; if(a.etat){p*=c;F.push({k:"État : "+a.etat.toLowerCase(),m:c})}
  const sz=SIZE_M[a.taille]; if(sz&&sz!==1){p*=sz;F.push({k:"Taille "+a.taille+(sz>1?" (très demandée)":" (moins demandée)"),m:sz})}
  const NO_MAT=Object.fromEntries(TYPE_GROUPS.filter(g=>["Chaussures","Sacs & maroquinerie","Accessoires"].includes(g[0])).flatMap(g=>g[1]).map(t=>[t,1])); NO_MAT["Sac"]=1; const mm=NO_MAT[type]?1:MAT_M[a.matiere]; if(mm&&mm!==1){p*=mm;F.push({k:"Matière : "+a.matiere.toLowerCase(),m:mm})}
  (a.details||[]).forEach(d=>{const x=DET_M[d];if(x&&x!==1){p*=x;F.push({k:d,m:x})}});
  const sf=seasonFactor(type); if(Math.abs(sf-1)>.01){p*=sf;F.push({k:sf>1?"Pleine saison":"Hors saison",m:sf})}
  const gm=GENRE_M[a.genre]||1; if(gm!==1){p*=gm;F.push({k:"Pièce "+a.genre.toLowerCase(),m:gm})}
  const ic=iconFactor(a.modele); if(ic.m!==1){p*=ic.m;F.push({k:"Modèle : "+ic.hits.join(", "),m:ic.m})}
  const cm=COLOR_M[a.couleur]; if(cm&&cm!==1){p*=cm;F.push({k:"Couleur "+a.couleur.toLowerCase()+(cm>1?" (passe-partout)":" (plus difficile)"),m:cm})}
  const ssz=SHOE_SIZE_M[a.taille]; if(ssz&&ssz!==1&&/P\d\d/.test(a.taille||"")){p*=ssz;F.push({k:"Pointure "+a.taille.slice(1)+(ssz>1?" (très demandée)":" (moins demandée)"),m:ssz})}
  let dm=1; (a.defs||[]).forEach(d=>{dm*=DEFAUTS[d]||1}); dm=Math.max(.5,dm);
  if((a.defs||[]).length){p*=dm;F.push({k:"Défauts : "+a.defs.map(x=>x.toLowerCase()).join(", "),m:dm})}
  else if((a.defauts||"").trim()){p*=.9;F.push({k:"Défaut signalé",m:.9})}
  // recalage sur tes ventes
  let own=null, ownN=0, calib=1;
  if(a.marque){
    const same=db.articles.filter(x=>isSold(x)&&x.id!==a.id&&norm(brandName(x.marque))===norm(brandName(a.marque))&&num(x.prixVente)>0);
    const sameType=same.filter(x=>x.type===a.type);
    if(sameType.length){own=sum(sameType,x=>num(x.prixVente))/sameType.length;ownN=sameType.length}
    if(same.length>=2){ // ratio réalisé / estimé pour cette marque, toutes catégories
      const ratios=same.map(x=>{const e=estimateRaw(x);return e>0?num(x.prixVente)/e:null}).filter(v=>v&&isFinite(v));
      if(ratios.length>=2){const r=sum(ratios)/ratios.length;calib=Math.min(1.6,Math.max(.6,r));const w=ratios.length/(ratios.length+3);calib=1+(calib-1)*w;if(Math.abs(calib-1)>.02){p*=calib;F.push({k:`Tes ventes ${brandName(a.marque)} (${ratios.length})`,m:calib})}}
    }
  }
  if(calib===1){ // pas d'historique sur cette marque : on se cale sur ta gamme, puis sur la catégorie
    const soldAll=db.articles.filter(x=>isSold(x)&&x.id!==a.id&&num(x.prixVente)>0);
    const pools=[[br?soldAll.filter(x=>{const b=brandOf(x.marque);return b&&b.tier===br.tier}):[],`Tes ventes ${br?TIER_LABEL[br.tier].toLowerCase():""}`],[soldAll.filter(x=>x.type===a.type),`Tes ventes en ${(a.type||"").toLowerCase()}`]];
    for(const [pool,label] of pools){ if(pool.length<3) continue; const ratios=pool.map(x=>{const e=estimateRaw(x);return e>0?num(x.prixVente)/e:null}).filter(v=>v&&isFinite(v)); if(ratios.length<3) continue;
      let r=Math.min(1.6,Math.max(.6,sum(ratios)/ratios.length)); const w=ratios.length/(ratios.length+4); r=1+(r-1)*w; if(Math.abs(r-1)>.02){p*=r;calib=r;F.push({k:`${label} (${ratios.length})`,m:r})} break }
  }
  let fair=p;
  const comps=parseComps(a.comps); let compsMed=NaN;
  if(comps.length){ compsMed=median(comps)*.9; const w=comps.length/(comps.length+1.5); fair=fair*(1-w)+compsMed*w; F.push({k:`${comps.length} annonce${comps.length>1?"s":""} similaire${comps.length>1?"s":""} vue${comps.length>1?"s":""} (médiane ${fmtE0(median(comps))}, −10 % de négo)`,m:null,base:compsMed}) }
  if(own&&ownN){const w=ownN/(ownN+2);fair=fair*(1-w)+own*w;F.push({k:`Moyenne de tes ${ownN} vente(s) ${a.type} ${brandName(a.marque)} : ${fmtE0(own)}`,m:null,note:true})}
  const cost=artCost(a);
  const mid=nice(fair); let list=nice(fair*1.15), quick=nice(fair*.8); const high=nice(fair*1.3); if(list<=mid) list=mid+1; if(quick>=mid&&mid>3) quick=mid-1;
  let floor=nice(Math.max(fair*.7, cost>0?cost*1.3+1:0)); if(floor>quick) floor=quick;
  let conf=0; if(br)conf+=br.custom?1.2:2; else if(custom)conf+=0; if(a.type)conf+=1; if(a.etat)conf+=1; if(a.taille)conf+=1; if(a.matiere)conf+=.5; if(ownN)conf+=1.5; if(neufOK)conf+=1.5; if(comps.length)conf+=comps.length>=3?3:1.5;

}
const NO_MAT_RAW=Object.fromEntries([...TYPE_GROUPS.filter(g=>["Chaussures","Sacs & maroquinerie","Accessoires"].includes(g[0])).flatMap(g=>g[1]),"Sac"].map(t=>[t,1]));
function estimateRaw(a){ // estimation sans recalage ni historique (pour la calibration)
  const type=TYPES[a.type]?a.type:"Autre", br=brandOf(a.marque); let p=(br?retailOf(br,type):TIER_RP[2]*.8*(TYPE_RF[type]||.8))*RET[br?br.tier:2];
  if(br&&br.hot[type])p*=br.hot[type]; p*=COND[a.etat]||1; p*=SIZE_M[a.taille]||1; if(!NO_MAT_RAW[type]) p*=MAT_M[a.matiere]||1; (a.details||[]).forEach(d=>{p*=DET_M[d]||1}); return p }

  async put(id,data){ try{const d=await this.open(); await new Promise((res,rej)=>{const t=d.transaction("p","readwrite");t.objectStore("p").put(data,id);t.oncomplete=res;t.onerror=()=>rej(t.error)}); this.cache[id]=data; return true}catch(e){return false} },
  async get(id){ if(this.cache[id]) return this.cache[id]; try{const d=await this.open(); return await new Promise(res=>{const r=d.transaction("p").objectStore("p").get(id); r.onsuccess=()=>{this.cache[id]=r.result||null;res(r.result||null)}; r.onerror=()=>res(null)})}catch(e){return null} },
  async del(id){ delete this.cache[id]; try{const d=await this.open(); d.transaction("p","readwrite").objectStore("p").delete(id)}catch(e){} }
};

/* ---------- Projection réaliste ----------
   On ne vend jamais tout, et rarement au prix affiché. On calibre deux choses sur TES ventes :
   - ratio : prix encaissé / prix affiché (négociation, baisses) — défaut 0.88
   - taux : part des pièces qui finissent vendues — défaut 70 %
   et on fait trois scénarios. */
const PROJ_DEF={ratio:.88,rate:.70};
function calibration(A){
  const S=db.settings, sold=A.filter(isSold);
  const rs=sold.filter(a=>num(a.prixAffiche)>0&&num(a.prixVente)>0).map(a=>num(a.prixVente)/num(a.prixAffiche)).filter(v=>v>.3&&v<1.5);
  let ratio=PROJ_DEF.ratio, ratioN=rs.length;
  if(rs.length){ const w=rs.length/(rs.length+4); ratio=PROJ_DEF.ratio*(1-w)+(sum(rs)/rs.length)*w }
  // pièces "jugées" : vendues, invendables, ou en ligne depuis longtemps sans partir
  const stale=A.filter(a=>!isSold(a)&&a.statut!=="Invendable"&&(daysOnline(a)||0)>=S.alerteJours*2).length;
  const inv=A.filter(a=>a.statut==="Invendable").length, decided=sold.length+inv+stale;
  let rate=PROJ_DEF.rate, rateN=decided;
  if(decided>=5){ const w=decided/(decided+8); rate=PROJ_DEF.rate*(1-w)+(sold.length/decided)*w }
  rate=Math.min(.95,Math.max(.3,rate)); ratio=Math.min(1.05,Math.max(.6,ratio));
  return {ratio,ratioN,rate,rateN};
}
function project(live,cal){
  cal=cal||calibration(db.articles);
  let pess=0,real=0,opt=0,max=0,n=0;
  for(const a of live){
    let p=num(a.prixAffiche); if(!(p>0)){ const e=estimate(a); p=e.mid; if(!(p>0)) continue }
    n++; max+=p;
    real+=p*cal.ratio*cal.rate;
    pess+=p*Math.max(.6,cal.ratio-.1)*Math.max(.3,cal.rate-.2);
    opt +=p*Math.min(1,cal.ratio+.06)*Math.min(1,cal.rate+.15);
  }
  return {pess,real,opt,max,n,cal};
}
function projSheet(){
  const s=stats(), c=s.cal, pj=s.proj;
  const row=(l,v,sub)=>`<div><span>${l}${sub?`<br><small class="muted">${sub}</small>`:""}</span><b>${v}</b></div>`;
  openSheet("Projection du bénéfice",`
    <p class="muted" style="margin:0 0 4px;font-size:14px">Ton bénéfice net actuel est de <b>${fmtSigned(s.net)}</b>. Voilà où tu peux arriver avec les ${pj.n} pièces encore dispo (${fmtE0(pj.max)} de prix affichés) :</p>
    <div class="proj">
      <div class="pc"><div class="pl">Pessimiste</div><div class="pv ${sgn(s.projPess)}">${fmtSigned(s.projPess)}</div><div class="ps">${Math.round(Math.max(.3,c.rate-.2)*100)} % vendues · −${Math.round((1-Math.max(.6,c.ratio-.1))*100)} %</div></div>
      <div class="pc on"><div class="pl">Réaliste</div><div class="pv ${sgn(s.projReal)}">${fmtSigned(s.projReal)}</div><div class="ps">${Math.round(c.rate*100)} % vendues · −${Math.round((1-c.ratio)*100)} %</div></div>
      <div class="pc"><div class="pl">Optimiste</div><div class="pv ${sgn(s.projOpt)}">${fmtSigned(s.projOpt)}</div><div class="ps">${Math.round(Math.min(1,c.rate+.15)*100)} % vendues · −${Math.round((1-Math.min(1,c.ratio+.06))*100)} %</div></div>
    </div>
    <div class="proj-rows">
      ${row("Si <i>tout</i> part au prix affiché",fmtSigned(s.potentiel),"le max théorique, ça n'arrive jamais")}
      ${row("Prix encaissé / prix affiché",fmtP(c.ratio),c.ratioN?`calé sur tes ${c.ratioN} vente${c.ratioN>1?"s":""} (négo, baisses de prix)`:"valeur par défaut, tes ventes affineront")}
      ${row("Part des pièces qui se vendent",fmtP(c.rate),c.rateN>=5?`calé sur ${c.rateN} pièces jugées (vendues, invendables, en ligne depuis +${db.settings.alerteJours*2} j)`:"valeur par défaut Vinted, affinée dès 5 pièces jugées")}
      ${row("Stock au coût d'achat",fmtE(s.stockCout),"déjà compté dans le bénéfice net")}
    </div>
    <p class="hint" style="margin-top:12px">Les pièces invendables sont exclues. Plus tu enregistres de ventes, plus la projection colle à ta réalité.</p>`);
}
function stats(){
  const S=db.settings, A=db.articles, sold=A.filter(isSold);
  const s={};
  s.investLots=sum(db.lots,lotCost); s.depenses=sum(db.depenses,d=>num(d.montant)); s.frais=sum(A,a=>num(a.frais));
  s.out=s.investLots+s.depenses+s.frais;
  s.ca=sum(sold,a=>num(a.prixVente)); s.net=s.ca-s.out; s.benefVentes=sum(sold,artProfit);
  s.roi=s.out>0?s.net/s.out:NaN; s.recup=s.out>0?Math.min(1,s.ca/s.out):0; s.reste=Math.max(0,s.out-s.ca);
  const live=A.filter(a=>!isSold(a)&&a.statut!=="Invendable");
  s.stockCout=sum(live,artCost); s.stockPrix=sum(live,a=>num(a.prixAffiche)); s.potentiel=s.net+s.stockPrix;
  s.cal=calibration(A); const pj=project(live,s.cal); s.proj=pj; s.projPess=s.net+pj.pess; s.projReal=s.net+pj.real; s.projOpt=s.net+pj.opt;
  s.nTot=A.length; s.nSold=sold.length; s.nLigne=A.filter(a=>a.statut==="En ligne"||a.statut==="Réservé").length;
  s.nStock=A.filter(a=>a.statut==="En stock"||a.statut==="Retourné").length; s.nInv=A.filter(a=>a.statut==="Invendable").length;
  s.ecoul=s.nTot?s.nSold/s.nTot:NaN; s.panier=s.nSold?s.ca/s.nSold:NaN; s.benefMoy=s.nSold?s.benefVentes/s.nSold:NaN;
  s.marge=s.ca>0?s.benefVentes/s.ca:NaN;
  const mults=sold.filter(a=>artCost(a)>0).map(a=>num(a.prixVente)/artCost(a)); s.mult=mults.length?sum(mults)/mults.length:NaN;
  const dl=sold.map(daysOnline).filter(v=>v!==null&&v>=0); s.delai=dl.length?sum(dl)/dl.length:NaN; s.rapide=dl.length?Math.min(...dl):NaN;
  s.best=sold.length?Math.max(...sold.map(artProfit)):NaN; s.bestId=sold.length?sold.reduce((m,a)=>artProfit(a)>artProfit(m)?a:m).id:null;
  s.minArt=sum(A,artMinutes); s.minHors=sum(db.temps,t=>num(t.minutes)); s.min=s.minArt+s.minHors; s.h=s.min/60;
  s.eurh=s.h>0?s.net/s.h:NaN; s.eurhV=s.h>0?s.benefVentes/s.h:NaN; s.ecart=isFinite(s.eurhV)?s.eurhV-S.taux:NaN;
  s.valTemps=s.h*S.taux; s.netApres=s.net-s.valTemps; s.minParVente=s.nSold?sum(sold,artMinutes)/s.nSold:NaN;
  const t=today(), ym=t.slice(0,7), y=t.slice(0,4);
  s.moisBenef=sum(sold.filter(a=>(a.dateVente||"").startsWith(ym)),artProfit); s.moisCA=sum(sold.filter(a=>(a.dateVente||"").startsWith(ym)),a=>num(a.prixVente));
  s.moisN=sold.filter(a=>(a.dateVente||"").startsWith(ym)).length;
  s.objP=S.objectif>0?s.moisBenef/S.objectif:NaN;
  const sy=sold.filter(a=>(a.dateVente||"").startsWith(y)); s.dacN=sy.length; s.dacEur=sum(sy,a=>num(a.prixVente));
  // months
  const dates=[...db.lots.map(l=>l.date),...A.map(a=>a.dateVente||a.dateEnLigne),...db.depenses.map(d=>d.date)].filter(Boolean).sort();
  const start=dates[0]?pd(dates[0]):new Date(); const now=new Date();
  let cur=new Date(start.getFullYear(),start.getMonth(),1); const months=[];
  while(cur<=now||months.length<1){months.push(cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0")); cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); if(months.length>24)break}
  const last=months.slice(-12); let cum=0;
  s.months=months.map(m=>{const sm=sold.filter(a=>(a.dateVente||"").startsWith(m));
    const ca=sum(sm,a=>num(a.prixVente)), bv=sum(sm,artProfit), out=sum(db.lots.filter(l=>(l.date||"").startsWith(m)),lotCost)+sum(db.depenses.filter(d=>(d.date||"").startsWith(m)),d=>num(d.montant))+sum(sm,a=>num(a.frais));
    cum+=ca-out; return {m,n:sm.length,ca,bv,out,cash:ca-out,cum,listed:A.filter(a=>(a.dateEnLigne||"").startsWith(m)).length}}).filter(x=>last.includes(x.m));
  // groups
  const grp=key=>{const g={};A.forEach(a=>{const k=key(a)||"—";(g[k]=g[k]||{k,n:0,sold:0,ca:0,b:0,dl:[]});const o=g[k];o.n++;if(isSold(a)){o.sold++;o.ca+=num(a.prixVente);o.b+=artProfit(a);const d=daysOnline(a);if(d!==null)o.dl.push(d)}});
    return Object.values(g).map(o=>({...o,ecoul:o.n?o.sold/o.n:0,bm:o.sold?o.b/o.sold:NaN,delai:o.dl.length?sum(o.dl)/o.dl.length:NaN}))};
  s.byType=grp(a=>a.type).sort((a,b)=>b.b-a.b||b.n-a.n);
  s.byBrand=grp(a=>a.marque&&brandName(a.marque)).sort((a,b)=>b.b-a.b||b.n-a.n);
  s.statusCounts=STATUTS.map(st=>A.filter(a=>a.statut===st).length);
  return s;
}

  return out;
}

function rng(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];

  if(ton==="pepite"){
    L.push(pick(r,["🔥 ","✨ ","💎 "])+line1);
    const plus=[rare,season].filter(Boolean); if(plus.length) L.push(cap(plus.join(", "))+".");
    L.push("");
    if(marque) L.push(`✔️ Marque : ${marque}${modele?" "+modele:""}`);
    if(a.taille) L.push(`✔️ Taille : ${a.taille}${fitL?", "+fitL:""}`);
    if(a.couleur) L.push(`✔️ Couleur : ${coul}`);
    if(a.matiere) L.push(`✔️ Matière : ${a.matiere.toLowerCase()}`);
    L.push(`✔️ État : ${etatTxt}, ${e.d}`);
    if(mes.length) L.push(`📏 Mesures : ${mes.join(", ")}`);
    if(extraDet.length) L.push(`✔️ Détails : ${extraDet.join(", ")}`);
    if(defaut) L.push(`⚠️ À noter : ${defaut}, visible en photo, prix ajusté`);
    L.push("");
    L.push("📦 Envoi sous 24/48 h, colis soigné");
    L.push(`🔁 ${cap(lot)}`);
    L.push("💬 Offres raisonnables acceptées");
  } else if(ton==="clean"){
    L.push(line1);
    const plus=[rare,season].filter(Boolean); if(plus.length) L.push(cap(plus.join(", "))+".");
    L.push("");
    const f=[]; if(marque) f.push(`Marque : ${marque}${modele?" "+modele:""}`); if(a.taille) f.push(`Taille : ${a.taille}`); if(a.couleur) f.push(`Couleur : ${coul}`); if(a.matiere) f.push(`Matière : ${a.matiere.toLowerCase()}`); f.push(`État : ${etatTxt}, ${e.d}`); if(mes.length) f.push(`Mesures à plat : ${mes.join(", ")}`); if(extraDet.length) f.push(`Détails : ${extraDet.join(", ")}`); if(defaut) f.push(`À noter : ${defaut}, visible en photo`);
    L.push(...f);
    L.push("");
    L.push("Envoi sous 24/48 h, colis soigné. "+cap(lot)+". Offres raisonnables acceptées.");
  } else {
    L.push(`${cap(nom)}${a.taille?" taille "+a.taille:""}${coul?" "+coul:""}`);
    L.push(`${cap(etatTxt)}${defaut?", "+defaut:""}${a.matiere?", "+a.matiere.toLowerCase():""}`);
    if(mes.length) L.push(mes.join(", "));
    L.push("Envoi 24/48 h, "+lot);
  }
  if(ton!=="express"){ L.push(""); L.push("Mots-clés : "+kw) }
  const tags=new Set();
  if(br) br.tags.forEach(x=>tags.add("#"+x)); else if(marque) tags.add(tagify(marque));
  tags.add("#"+t.tag); if(coul) tags.add(tagify(coul.split(" ")[0]));
  if(det.includes("Vintage")) tags.add("#vintage");
  if(t.warm&&coldSeason) tags.add("#automne");
  tags.add(a.genre==="Femme"?"#femme":"#homme");
  const hashtags=[...tags].slice(0,ton==="express"?5:8).join(" ");
  const clean=x=>x.replace(/[—–]/g,",").replace(/ ,/g,",").replace(/ {2,}/g," ").replace(/ ([.,])/g,"$1").replace(/\n{3,}/g,"\n\n");
  return {titre:clean(titre).slice(0,50),desc:clean(L.join("\n")),hashtags};
}

/* ---------- Swipe actions (façon iOS) ---------- */
const SW={el:null,open:null,x0:0,y0:0,x:0,axis:null,w:0,awL:0,awR:0,suppress:false,raf:0,side:null,startX:0,vx:0,lastX:0,lastT:0};
const SPRING="transform .32s cubic-bezier(.22,1.1,.36,1)";
function swBody(el){return el.querySelector(".sw-body")}
function swClose(el,instant){ if(!el) return; const b=swBody(el); b.style.transition=instant?"none":SPRING; b.style.transform="translateX(0)"; el.classList.remove("open","full","full-r","drag","left","right"); el.style.removeProperty("--p"); if(SW.open===el) SW.open=null }
function swPaint(){ SW.raf=0; const el=SW.el; if(!el) return; const x=SW.x; swBody(el).style.transform=`translateX(${x}px)`;
  const side=x<0?"left":x>0?"right":null; if(side!==SW.side){ SW.side=side; el.classList.toggle("left",side==="left"); el.classList.toggle("right",side==="right") }
  const aw=side==="left"?SW.awL:SW.awR; el.style.setProperty("--p",aw?Math.min(1,Math.abs(x)/aw).toFixed(3):0);
  const raw=SW.raw||0; const fullL=raw<-SW.w*.5&&SW.awL>0, fullR=raw>SW.w*.5&&SW.awR>0;
  if(fullL!==el.classList.contains("full")){ el.classList.toggle("full",fullL); if(fullL) buzz(8) }
  if(fullR!==el.classList.contains("full-r")){ el.classList.toggle("full-r",fullR); if(fullR) buzz(8) }
}
function rubber(d,limit){ return d<=limit?d:limit+(d-limit)*0.45 }
document.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0) return;
  const body=e.target.closest(".sw-body"); const el=body&&body.closest(".sw");
  if(SW.open&&SW.open!==el&&!(e.target.closest(".sw")===SW.open)) swClose(SW.open);
  if(!el) return;
  const L=el.querySelector(".sw-acts.l"), R=el.querySelector(".sw-acts.r");
  SW.el=el; SW.x0=e.clientX; SW.y0=e.clientY; SW.axis=null; SW.side=null; SW.w=el.offsetWidth; SW.awL=L?L.offsetWidth:0; SW.awR=R?R.offsetWidth:0;
  const cur=swBody(el).style.transform.match(/-?[\d.]+/); SW.startX=el.classList.contains("open")&&cur?parseFloat(cur[0]):0; SW.x=SW.startX;
  SW.lastX=e.clientX; SW.lastT=e.timeStamp; SW.vx=0; body.style.transition="none";
},{passive:true});
document.addEventListener("pointermove",e=>{
  const el=SW.el; if(!el) return;
  const dx=e.clientX-SW.x0, dy=e.clientY-SW.y0;
  if(!SW.axis){ if(Math.abs(dx)<5&&Math.abs(dy)<5) return; SW.axis=Math.abs(dx)>Math.abs(dy)*1.15?"x":"y"; if(SW.axis==="x"){ el.classList.add("drag"); try{swBody(el).setPointerCapture(e.pointerId)}catch(_){} } }
  if(SW.axis!=="x") return;
  let x=SW.startX+dx; SW.raw=x;
  if(x<0){ const lim=SW.awL||0; x=-rubber(-x,lim); if(!SW.awL) x=-rubber(-x,0)*.5; if(x<-SW.w*.92) x=-SW.w*.92 }
  else if(x>0){ const lim=SW.awR||0; x=rubber(x,lim); if(!SW.awR) x=x*.5; if(x>SW.w*.92) x=SW.w*.92 }
  const dt=e.timeStamp-SW.lastT; if(dt>0){ SW.vx=(e.clientX-SW.lastX)/dt; SW.lastX=e.clientX; SW.lastT=e.timeStamp }
  SW.x=x; if(!SW.raf) SW.raf=requestAnimationFrame(swPaint);
},{passive:true});
function swFire(el,btn,dir){ const b=swBody(el); b.style.transition="transform .18s ease-out"; b.style.transform=`translateX(${dir*SW.w}px)`; el.classList.remove("full","full-r"); buzz(18); markSwipeLearned();
  setTimeout(()=>{ swClose(el,true); if(btn) btn.click() },150) }
function swEnd(e,cancel){
  const el=SW.el; if(!el) return; SW.el=null; if(SW.raf){cancelAnimationFrame(SW.raf);SW.raf=0;swPaint.call(null)}
  if(SW.axis){ SW.suppress=true; setTimeout(()=>SW.suppress=false,350) }
  el.classList.remove("drag");
  if(SW.axis!=="x") return;
  if(cancel){ swClose(el); return }
  const x=SW.x, v=SW.vx, raw=SW.raw||0; // px/ms
  const L=el.querySelector(".sw-acts.l"), R=el.querySelector(".sw-acts.r");
  if(x<0&&L){ if(el.classList.contains("full")||(v<-1.2&&raw<-SW.w*.3)) return swFire(el,L.querySelector(".sw-act"),-1);
    if(x<-SW.awL*.4||v<-.5){ swBody(el).style.transition=SPRING; swBody(el).style.transform=`translateX(${-SW.awL}px)`; el.style.setProperty("--p",1); el.classList.add("open"); SW.open=el; buzz(6); markSwipeLearned(); return } }
  if(x>0&&R){ if(el.classList.contains("full-r")||(v>1.2&&raw>SW.w*.3)) return swFire(el,R.querySelector(".sw-act"),1);
    if(x>SW.awR*.4||v>.5){ swBody(el).style.transition=SPRING; swBody(el).style.transform=`translateX(${SW.awR}px)`; el.style.setProperty("--p",1); el.classList.add("open"); SW.open=el; buzz(6); markSwipeLearned(); return } }
  swClose(el);
}
document.addEventListener("pointerup",e=>swEnd(e,false),{passive:true});
document.addEventListener("pointercancel",e=>swEnd(e,true),{passive:true});
document.addEventListener("click",e=>{ if(SW.suppress&&e.target.closest(".sw-body")){e.stopPropagation();e.preventDefault();SW.suppress=false;return}
  if(SW.open){ const inBody=e.target.closest(".sw-body"); if(inBody&&inBody.closest(".sw")===SW.open){ e.stopPropagation(); e.preventDefault(); swClose(SW.open); return } if(!e.target.closest(".sw-acts")) swClose(SW.open) } },true);

const layers=[]; let popping=false, expectPop=0;
function pushLayer(n){ layers.push(n); try{history.pushState({layer:n,depth:layers.length},"")}catch(e){} }
function popLayer(n){ const i=layers.lastIndexOf(n); if(i<0) return; layers.splice(i,1); if(!popping){ expectPop++; try{history.back()}catch(e){expectPop--} } }
window.addEventListener("popstate",()=>{ if(expectPop>0){expectPop--;return} if(!layers.length) return; popping=true; const n=layers[layers.length-1]; if(n==="lightbox") closeLightbox(); else if(n==="studio") closeStudio(); else if(n==="picker") closePicker(); else closeSheet(); popping=false; });

    case "drop-price": { const a=A(); if(!a) break; const old=num(a.prixAffiche); if(!(old>0)){toast("Pas de prix affiché sur cette pièce");openArt(id);break} const cost=artCost(a); let nv=Math.max(Math.ceil(cost*1.2)||1,Math.round(old*0.9)); if(nv>=old) nv=old-1; if(nv<1){toast("Prix déjà au plancher");break} a.prixAffiche=String(nv); save(); render(); const fp=$("#fPrix"); if(fp) fp.value=nv; toastUndo(`${fmtE0(old)} → ${fmtE0(nv)}${a.vintedUrl?"":" · modifie-le sur Vinted"}`,()=>{a.prixAffiche=String(old);save();render()},a.vintedUrl||null); break }
    case "mark-reserve": { const a=A(); if(!a) break; const prev=a.statut; a.statut="Réservé"; save(); render(); toastUndo(`${a.ref} réservée`,()=>{a.statut=prev;save();render()}); break }
    case "mark-online": { const a=A(); if(!a) break; const prev=a.statut; a.statut="En ligne"; save(); render(); toastUndo(`${a.ref} remise en ligne`,()=>{a.statut=prev;save();render()}); break }
    case "mark-inv": { const a=A(); if(!a) break; const prev=a.statut; a.statut="Invendable"; save(); render(); toastUndo(`${a.ref} marquée invendable`,()=>{a.statut=prev;save();render()}); break }
    case "mark-retour": { const a=A(); if(!a) break; const prev={statut:a.statut,prixVente:a.prixVente,dateVente:a.dateVente}; a.statut="Retourné"; a.prixVente=""; a.dateVente=""; save(); render(); toastUndo(`${a.ref} marquée retournée`,()=>{Object.assign(a,prev);save();render()}); break }
    case "mark-stock": { const a=A(); if(!a) break; const prev=a.statut; a.statut="En stock"; save(); render(); toastUndo(`${a.ref} remise en stock`,()=>{a.statut=prev;save();render()}); break }
    case "del-art-now": { const a=A(); if(!a) break; const idx=db.articles.indexOf(a); db.articles.splice(idx,1); save(); render(); toastUndo(`${a.ref} supprimée`,()=>{db.articles.splice(Math.min(idx,db.articles.length),0,a);save();render()}); break }
    case "pane": { document.querySelectorAll(".seg2 [role=tab]").forEach(b=>b.classList.toggle("on",b.dataset.id===id)); document.querySelectorAll(".fpane").forEach(p=>p.hidden=p.dataset.pane!==id); $("#sheetBody").scrollTop=0; break }
    case "toggle-sec": { const sec=t.closest(".coll"); const open=!sec.classList.contains("open"); sec.classList.toggle("open",open); t.setAttribute("aria-expanded",open); uiPrefs["sec_"+id]=open?1:0; uiSave(); if(open&&ui.view==="home"){destroyCharts();drawCharts()} break }
    case "pick-clear": setFormBrand(""); break;
    case "add-menu": { const enRoute=db.lots.filter(l=>l.statut==="En route"); const toFill=db.lots.filter(l=>l.statut==="Reçu"&&num(l.pieces)>0&&lotArts(l).length<num(l.pieces));
      openSheet("Ajouter",`<div class="menu">
        ${enRoute.map(l=>`<button data-act="receive" data-id="${l.id}"><span class="mi" style="background:var(--tag);color:var(--tag-ink)">📦</span><span><b>Réceptionner ${esc(l.ref)}</b><small>${esc(l.fournisseur)} · compter les pièces puis saisir</small></span></button>`).join("")}
        ${toFill.map(l=>`<button data-act="rafale" data-id="${l.id}"><span class="mi">✏️</span><span><b>Continuer ${esc(l.ref)}</b><small>${lotArts(l).length}/${num(l.pieces)} pièces saisies</small></span></button>`).join("")}
        <button data-act="new-art"><span class="mi">🏷</span><span><b>Une pièce</b><small>Ajoute un vêtement à ton stock</small></span></button>
        <button data-act="pick-rafale"><span class="mi">📦</span><span><b>Réception d'un lot</b><small>Saisie rapide de toutes les pièces d'une box</small></span></button>
        <button data-act="quick-sell"><span class="mi">✅</span><span><b>Une vente</b><small>Marque une pièce en ligne comme vendue</small></span></button>
        <button data-act="edit-lot"><span class="mi">🛒</span><span><b>Un nouveau lot</b><small>Box, ballot, chine…</small></span></button>
        <button data-act="deps"><span class="mi">💳</span><span><b>Une dépense</b><small>Emballage, boost…</small></span></button></div>`); break }
    case "new-art": openArt(null); break;
    case "pick-rafale": { const L=db.lots.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
      if(!L.length){lotForm();break}
      openSheet("Quel lot ?",`<div class="menu">${L.map(l=>`<button data-act="${l.statut==="En route"?"receive":"rafale"}" data-id="${l.id}"><span class="mi">📦</span><span><b>${esc(l.ref)} · ${esc(l.fournisseur)}</b><small>${esc(l.nom||"")} · ${lotArts(l).length}${num(l.pieces)?"/"+num(l.pieces):""} pièces saisies</small></span></button>`).join("")}</div>`); break }
    case "quick-sell": { const L=db.articles.filter(a=>a.statut==="En ligne"||a.statut==="Réservé");
      openSheet("Qu'est-ce qui est vendu ?",L.length?`<div class="list">${L.map(a=>artLine(a).replace('data-act="open-art"','data-act="sell"')).join("")}</div>`:`<div class="empty"><h3>Rien en ligne</h3><p>Mets d'abord des pièces en ligne depuis le Stock.</p></div>`); break }
    case "open-art": openArt(id); break;
    case "sell": { const a=A(); if(a) sellSheet(a); break }
    case "publish": { const a=A(); if(a) publishSheet(a); break }
    case "reserve": { const a=A(); if(a){a.statut="Réservé";if(!a.dateEnLigne)a.dateEnLigne=today();save();closeSheet();render();toast("Marqué réservé")} break }
    case "annonce": { const a=A(); if(a) annonceSheet(a); break }
    case "ann-ton": annState.ton=t.dataset.v; annState.draw(); break;
    case "ann-shuffle": annState.seed++; annState.draw(); break;
    case "proj": projSheet(); break;
    case "studio": { const f=$("#artForm"); const base=f&&f.dataset.id?db.articles.find(x=>x.id===f.dataset.id):{}; openStudio(f?draftFromForm(base||{}):(A()||{})); break }
    case "st-auto": ST.auto=!ST.auto; t.classList.toggle("pri",ST.auto); stDrawSoon(); break;
    case "st-ratio": ST.ratio=ST.ratio==="1"?"45":"1"; $("#studioBody").innerHTML=studioHTML(); stDrawSoon(); break;
    case "st-reset": Object.assign(ST,{zoom:1,x:0,y:0,bri:0,con:0,warm:0,sat:0,auto:true,badge:""}); stSnap(); $("#studioBody").innerHTML=studioHTML(); stDrawSoon(); break;
    case "st-badge": ST.badge=t.dataset.v||""; t.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===t)); stDrawSoon(); e.stopPropagation(); break;
    case "st-sel": stSelect(+t.dataset.i); $("#studioBody").innerHTML=studioHTML(); stDrawSoon(); break;
    case "st-apply-all": stSnap(); ST.items.forEach(it=>{["bri","con","warm","sat","auto"].forEach(k=>it[k]=ST[k])}); toast("Réglages appliqués à toutes les photos"); break;
    case "st-share": stShare(); break;
    case "st-use": stUse(); break;
    case "vinted-go": { const g=annState.art&&annState.art._ann; if(g) copyText(g.titre+"\n\n"+g.desc+"\n\n"+g.hashtags); buzz(10);
      if(annState.repost&&annState.art){ const a=db.articles.find(x=>x.id===annState.art.id); if(a){ const prev={dateEnLigne:a.dateEnLigne,vintedUrl:a.vintedUrl,reposts:a.reposts||0}; a.dateEnLigne=today(); a.reposts=(a.reposts||0)+1; a.vintedUrl=""; save(); annState.repost=false; render(); setTimeout(()=>toastUndo(`Republiée (×${a.reposts}), compteur de jours remis à zéro`,()=>{Object.assign(a,prev);save();render()}),700) } } break }
    case "repost": { const a=A(); if(a) annonceSheet(a,{repost:true}); break }
    case "copy": { const g=annState.art&&annState.art._ann; if(!g)break; const txt=t.dataset.t==="titre"?g.titre:t.dataset.t==="desc"?g.desc+"\n\n"+g.hashtags:g.titre+"\n\n"+g.desc+"\n\n"+g.hashtags; copyText(txt); break }
    case "dup-art": { const a=A(); if(!a)break; const c=JSON.parse(JSON.stringify(a)); Object.assign(c,{id:uid(),ref:nextRef("a"),created:Date.now(),statut:"En stock",photo:false,dateEnLigne:"",dateVente:"",prixVente:"",frais:""}); db.articles.push(c); save(); toast(`${c.ref} créée`); openArt(c.id); render(); break }
    case "del-art": if(t.classList.contains("armed")){const a=A();db.articles=db.articles.filter(x=>x.id!==id);if(a&&a.photo)Photos.del(id);save();closeSheet();render();toast("Pièce supprimée")}else{t.classList.add("armed");t.textContent="Appuie encore pour supprimer"} break;
    case "use-sug": { const i=$("#fPrix"); if(i){i.value=t.dataset.v; i.dispatchEvent(new Event("input",{bubbles:true}))} break }
    case "filter": ui.filter=id||"Tous"; ui.q=""; if(ui.view!=="stock")go("stock"); else render(); break;
    case "search": ui.q=id||""; ui.filter="Tous"; go("stock"); break;
    case "lot-stock": ui.q=lotById(id)?.ref||""; ui.filter="Tous"; closeSheet(); go("stock"); break;
    case "alert": { const a=t.dataset.a; if(a==="receive"||a==="rafale"){ if(a==="receive")receiveSheet(lotById(id)); else openArt(null,{rafale:true,lotId:id}) } else if(a==="filter"){ui.filter=id;go("stock")} else if(a==="nav"){ if(id==="backup")backupSheet(); else go(id)} else if(a==="sec"){ const sec=document.querySelector(`[data-sec="${id}"]`); if(sec){sec.classList.add("open");uiPrefs["sec_"+id]=1;uiSave();sec.scrollIntoView({behavior:"smooth",block:"start"})} } break }
    case "edit-lot": lotForm(id?lotById(id):null); break;
    case "receive": receiveSheet(lotById(id)); break;
    case "rafale": openArt(null,{rafale:true,lotId:id}); break;
    case "del-lot": if(t.classList.contains("armed")){db.lots=db.lots.filter(l=>l.id!==id);db.articles.forEach(a=>{if(a.lotId===id)a.lotId=""});save();closeSheet();render();toast("Lot supprimé")}else{t.classList.add("armed");t.textContent="Appuie encore : les pièces restent, sans lot"} break;
    case "deps": depsSheet(); break;
    case "del-dep": { const d=db.depenses.find(x=>x.id===id); db.depenses=db.depenses.filter(x=>x.id!==id); save(); depsSheet(); render(); if(d) toastUndo("Dépense supprimée",()=>{db.depenses.push(d);save();if(!$("#sheet").hidden)depsSheet();render()}); break }
    case "times": timesSheet(); break;
    case "del-time": { const d=db.temps.find(x=>x.id===id); db.temps=db.temps.filter(x=>x.id!==id); save(); timesSheet(); render(); if(d) toastUndo("Temps supprimé",()=>{db.temps.push(d);save();if(!$("#sheet").hidden)timesSheet();render()}); break }
    case "settings": settingsSheet(); break;
    case "backup": backupSheet(); break;
    case "exp-json": { const ok=download(`rayon-sauvegarde-${today()}.json`,exportJSON(),"application/json"); real.lastBackup=new Date().toISOString(); save(); toast(ok?"Sauvegarde téléchargée":"Téléchargement bloqué : utilise « Copier »"); break }
    case "copy-json": await copyText(exportJSON()); real.lastBackup=new Date().toISOString(); save(); break;
    case "exp-csv": toast(download(`rayon-articles-${today()}.csv`,exportCSV(),"text/csv;charset=utf-8")?"CSV téléchargé":"Téléchargement bloqué ici"); break;
    case "imp-file": $("#fileImport").click(); break;
    case "imp-txt": doImport(val("impTxt")); break;
    case "reset": if(t.classList.contains("armed")){try{localStorage.removeItem(KEY)}catch(_){} real=JSON.parse(JSON.stringify(SEED));db=real;save();closeSheet();go("home");toast("Tout est effacé")}else{t.classList.add("armed");t.textContent="Appuie encore pour tout effacer"} break;
    case "chrono": chronoToggle(); break;
    case "chrono-cancel": db.chrono=null; save(); closeSheet(); updChrono(); break;
    case "demo-on": demo=makeDemo(); db=demo; closeSheet(); go("home"); toast("Mode démo"); break;
    case "demo-off": demo=null; db=real; closeSheet(); go("home"); break;
  }
});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="artForm") return saveArtForm(f,e.submitter&&e.submitter.dataset.next==="1");
  if(f.id==="sellForm"){const a=db.articles.find(x=>x.id===f.dataset.id);if(!num(val("sPV"))){toast("Indique le prix de vente");return}
    Object.assign(a,{statut:"Vendu",prixVente:val("sPV"),dateVente:val("sDV")||today(),frais:val("sFr"),minEnvoi:val("sMin")});if(!a.dateEnLigne)a.dateEnLigne=a.dateVente;save();closeSheet();render();toast(`Vendu ! ${fmtSigned(artProfit(a))}`);buzz(25);return}
  if(f.id==="pubForm"){const a=db.articles.find(x=>x.id===f.dataset.id);Object.assign(a,{statut:"En ligne",prixAffiche:val("fPrix"),minAnnonce:val("pMin"),dateEnLigne:a.dateEnLigne||today(),vintedUrl:cleanUrl(val("pVurl"))||a.vintedUrl||""});save();closeSheet();render();toast("En ligne");return}
  if(f.id==="lotForm"){const id=f.dataset.id;let l=id?lotById(id):{id:uid(),ref:nextRef("l")};
    Object.assign(l,{fournisseur:val("lF")||"Lot",date:val("lD"),nom:val("lN"),prix:val("lP"),reduction:val("lR"),port:val("lPo"),poids:val("lK"),pieces:val("lPc"),facture:val("lFa"),statut:readOpt("lstatut")||"En route",notes:val("lNo")});
    if(!id)db.lots.push(l);save();closeSheet();render();toast(id?"Lot modifié":`${l.ref} créé`);return}
  if(f.id==="recForm"){const l=lotById(f.dataset.id);if(!num(val("rPc"))){toast("Indique le nombre de pièces");return}l.pieces=val("rPc");l.poids=val("rK")||l.poids;l.statut="Reçu";save();render();openArt(null,{rafale:true,lotId:l.id});toast("Lot réceptionné");return}
  if(f.id==="depForm"){if(!num(val("dM"))){toast("Indique un montant");return}db.depenses.push({id:uid(),date:val("dD")||today(),cat:readOpt("dcat")||"Autre",montant:val("dM"),detail:val("dX")});save();depsSheet();render();toast("Dépense ajoutée");return}
  if(f.id==="timeForm"){if(!num(val("tM"))){toast("Indique des minutes");return}db.temps.push({id:uid(),date:val("tD")||today(),minutes:val("tM"),label:val("tL")});save();timesSheet();render();toast("Temps ajouté");return}
  if(f.id==="chronoForm"){db.temps.push({id:uid(),date:val("cD")||today(),minutes:val("cM"),label:readOpt("cl")||"Autre"});db.chrono=null;save();closeSheet();render();toast("Temps ajouté");return}
  if(f.id==="setForm"){const S=db.settings;Object.assign(S,{taux:num(val("sTaux")),minAnnonce:num(val("sMinA")),minEnvoi:num(val("sMinE")),objectif:num(val("sObj")),alerteJours:Math.max(1,num(val("sAl"))),remiseLot:num(val("sRem")),dacN:num(val("sDN"))||30,dacEur:num(val("sDE"))||2000});save();closeSheet();render();toast("Réglages enregistrés");return}
});
document.addEventListener("input",e=>{
  if(e.target.id==="pickQ"){pickState.q=e.target.value;drawPicker();return}
  if(["fDef","fModele","fNeuf","fComps"].includes(e.target.id)){clearTimeout(window._defT);window._defT=setTimeout(refreshSug,350);return}
  if(e.target.id==="fPrix"){priceWarn();return}
  if(e.target.id==="stZoom"){ST.zoom=+e.target.value/100; e.target.parentElement.querySelector(".mono").textContent=ST.zoom.toFixed(1)+"×"; stDrawSoon(); return}
  if(e.target.dataset.k&&e.target.closest(".st-row")){ST[e.target.dataset.k]=+e.target.value; e.target.parentElement.querySelector(".mono").textContent=e.target.value; stDrawSoon(); return}
  if(e.target.id==="q"){ui.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener("change",async e=>{
  if(e.target.id==="sort"){ui.sort=e.target.value;render()}
  if(e.target.id==="fMatiere"||e.target.id==="fLot") refreshSug();
  if(e.target.id==="stFile"&&e.target.files[0]){ stSnap(); let first=-1; for(const f of [...e.target.files].slice(0,10)){ await stLoad(URL.createObjectURL(f)); if(ST.img){ const i=stAdd(ST.img); if(first<0) first=i } } if(first>=0) stSelect(first); e.target.value=""; $("#studioBody").innerHTML=studioHTML(); stDrawSoon(); return }
  if(e.target.id==="fPhoto"&&e.target.files[0]){try{pendingPhoto=await compress(e.target.files[0]);$("#photoBox").innerHTML=photoBoxHTML(`<img src="${pendingPhoto}" alt="Photo de l'article">`)}catch(_){toast("Impossible de lire cette photo")}}
  if(e.target.id==="fileImport"&&e.target.files[0]){const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(e.target.files[0]);e.target.value=""}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#lightbox").hidden)closeLightbox();else if(!$("#studio").hidden)closeStudio();else if(!$("#picker").hidden)closePicker();else if(!$("#sheet").hidden)closeSheet()}});

/* boot */
const h=(location.hash||"").slice(1); if(["home","stock","lots","more"].includes(h)) ui.view=h;
go(ui.view);
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>

</body>
